<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Key Quest</title>

  <!-- Leaflet CSS & JS for Interactive Real-World Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent-gold: #ffd700;
      --accent-blue: #007bff;
      --text-light: #f4f4f4;
      --danger: #ff4d4d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    #sidebar {
      width: 360px;
      background-color: var(--card-bg);
      padding: 15px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
      overflow-y: auto;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #000;
    }

    header {
      background: #0a0a0a;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-gold);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-gold);
    }

    .card {
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    button {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-danger {
      background: var(--danger);
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #121212;
      color: white;
      box-sizing: border-box;
    }

    .stat-bar {
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }

    .stat-fill {
      height: 100%;
      background: #28a745;
      width: 100%;
      transition: width 0.3s;
    }

    .stat-fill.low {
      background: var(--danger);
    }

    #log {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 8px;
      font-size: 0.85rem;
      overflow-y: auto;
      height: 140px;
      font-family: monospace;
    }

    .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px solid #222;
      padding-bottom: 2px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      max-width: 450px;
      width: 90%;
      border: 2px solid var(--accent-gold);
    }
  </style>
</head>
<body>

  <header>
    <h1>City Key Quest 🗝️</h1>
    <div id="city-title">Selected City: None</div>
  </header>

  <div id="app-container">
    <div id="sidebar">

      <!-- Setup & Lobby -->
      <div class="card" id="setup-card">
        <h3>1. Search City or ZIP</h3>
        <input type="text" id="city-input" placeholder="e.g. 23185 or Williamsburg" value="23185">
        <button onclick="loadCity()" style="margin-top: 8px;">Load Map Location</button>

        <h3 style="margin-top:12px;">2. Player & Voice Setup</h3>
        <input type="text" id="player-name" placeholder="Player Name" value="Explorer1">
        
        <label style="margin-top: 8px; display: block;">Voice Narrator Gender:</label>
        <select id="voice-gender-select">
          <option value="female">🎙️ Female Narrator Guide</option>
          <option value="male">🎙️ Male Narrator Guide</option>
        </select>

        <label style="margin-top: 8px; display: block;">Transport Mode:</label>
        <select id="transport-select">
          <option value="walk">🚶 Walking (+0 bonus move)</option>
          <option value="bike">🚲 Bike (+1 bonus move)</option>
          <option value="car">🚗 Car (+2 bonus moves)</option>
        </select>
        
        <label style="display: block; margin-top: 8px;">
          <input type="checkbox" id="dog-checkbox"> Bring Dog 🐕 (Must visit pet-friendly spots)
        </label>
        
        <button class="btn-gold" onclick="startGame()" style="margin-top: 10px;">Start Game</button>
      </div>

      <!-- Turn Controls -->
      <div class="card" id="game-controls" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="current-player-turn">Turn: Player</h3>
          <span id="moves-left-tag" style="color: var(--accent-gold); font-weight: bold;">Moves: 0</span>
        </div>
        <button id="roll-btn" class="btn-gold" onclick="rollDice()">🎲 Roll 1 Die</button>
        <button id="alley-btn" class="btn-danger" onclick="takeDarkAlleyShortcut()" style="margin-top: 6px;" disabled>🕶️ Take Dark Alley Shortcut</button>
      </div>

      <!-- Player Stats -->
      <div class="card" id="stats-card" style="display: none;">
        <div><strong>Points:</strong> <span id="score-val">0</span> | <strong>Tokens:</strong> <span id="token-val">50</span></div>
        <div style="margin-top: 6px;">
          <small>Player Health/Life:</small>
          <div class="stat-bar"><div id="health-bar" class="stat-fill"></div></div>
        </div>
        <div id="dog-stat-container" style="margin-top: 6px; display: none;">
          <small>Dog Hydration:</small>
          <div class="stat-bar"><div id="dog-bar" class="stat-fill" style="background: #17a2b8;"></div></div>
        </div>
      </div>

      <!-- Leaderboard -->
      <div class="card" id="leaderboard-card" style="display: none;">
        <h3>Live Leaderboard</h3>
        <ol id="leaderboard-list" style="margin: 0; padding-left: 20px;">
          <li>Explorer1 - 0 pts</li>
        </ol>
      </div>

      <!-- Log Window & Voice Test -->
      <div class="card" style="display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <h3 style="margin: 0;">Activity Log</h3>
          <button onclick="testVoice()" style="width: auto; padding: 2px 8px; font-size: 0.75rem;">🔊 Test Voice</button>
        </div>
        <div id="log"></div>
      </div>

    </div>

    <!-- Map Canvas -->
    <div id="map"></div>
  </div>

  <!-- Business Encounter Modal -->
  <div class="modal" id="encounter-modal">
    <div class="modal-content">
      <h2 id="modal-title">Location Name</h2>
      <p id="modal-type" style="color: var(--accent-gold); font-size: 0.9rem;"></p>
      <p id="modal-description">You stand outside the door. What would you like to do?</p>
      <div id="modal-actions" style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn-gold" onclick="openDoor()">🚪 Open Door & Search for Key</button>
        <button onclick="visitRestroomOrEat()">🍕 Spend 10 Tokens to Rest & Replenish Life</button>
        <button id="dog-water-btn" onclick="hydrateDog()" style="display:none;">🐕 Give Dog Water (Pet Friendly)</button>
        <button onclick="studyAtSchool()">📚 Study Clues (Skip 1 Turn)</button>
        <button onclick="closeModal()">Leave Location</button>
      </div>
    </div>
  </div>

  <script>
    let map, userMarker, keyMarker;
    let locations = [];
    let gameActive = false;
    let movesRemaining = 0;
    let availableVoices = [];
    
    // Player State
    let player = {
      name: "Explorer1",
      lat: 0,
      lng: 0,
      points: 0,
      tokens: 50,
      health: 100,
      dogHydration: 100,
      hasDog: false,
      transport: "walk",
      voiceGender: "female",
      inJailTurns: 0,
      isStudyingTurns: 0
    };

    let goldenKeyLocation = null;

    // Load Web Speech API Voices
    function initVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          availableVoices = window.speechSynthesis.getVoices();
        };
      }
    }
    initVoices();

    // Voice Voice Synthesis Engine
    function speak(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Stop prior narration

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = player.voiceGender === 'female' ? 1.2 : 0.8;

      // Select appropriate voice based on gender choice
      if (availableVoices.length > 0) {
        const preferredVoice = availableVoices.find(voice => {
          const name = voice.name.toLowerCase();
          if (player.voiceGender === 'female') {
            return name.includes('female') || name.includes('zira') || name.includes('samantha') || name.includes('victoria');
          } else {
            return name.includes('male') || name.includes('david') || name.includes('alex') || name.includes('george');
          }
        });

        if (preferredVoice) {
          utterance.voice = preferredVoice;
        }
      }

      window.speechSynthesis.speak(utterance);
    }

    function testVoice() {
      player.voiceGender = document.getElementById('voice-gender-select').value;
      speak(`Hello! I am your ${player.voiceGender} narrator. I will guide you through your city quest!`);
    }

    // Initialize Leaflet Map
    function initMap(lat = 37.2707, lng = -76.7075) {
      if (map) map.remove();
      map = L.map('map').setView([lat, lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }

    window.onload = () => {
      initMap();
      log("Welcome to City Key Quest. Select your voice narrator and city to begin.");
    };

    function log(msg, autoSpeak = true) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerText = `> ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;

      if(autoSpeak && gameActive) {
        speak(msg);
      }
    }

    // Fetch Coordinates for City/ZIP via Nominatim API
    async function loadCity() {
      const query = document.getElementById('city-input').value;
      if(!query) return alert("Please enter a city or ZIP code");

      log(`Searching for city or ZIP code ${query}`, false);
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          player.lat = lat;
          player.lng = lon;

          initMap(lat, lon);
          document.getElementById('city-title').innerText = `Selected City: ${data[0].display_name.split(',')[0]}`;
          
          userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Home Base").openPopup();
          
          fetchNearbyBusinesses(lat, lon);
          log("Map location loaded successfully.", false);
        } else {
          alert("City/ZIP not found.");
        }
      } catch (err) {
        log("Error finding city: " + err, false);
      }
    }

    // Generate local places/businesses using Overpass API
    async function fetchNearbyBusinesses(lat, lng) {
      const query = `
        [out:json];
        (
          node["amenity"](around:2000, ${lat}, ${lng});
          node["tourism"](around:2000, ${lat}, ${lng});
        );
        out body 15;
      `;
      const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

      try {
        const res = await fetch(url);
        const data = await res.json();
        locations = [];

        if(data.elements && data.elements.length > 0) {
          data.elements.forEach((el, index) => {
            if(el.tags && el.tags.name) {
              const isPetFriendly = index % 2 === 0;
              locations.push({
                id: index,
                name: el.tags.name,
                type: el.tags.amenity || el.tags.tourism || "Local Spot",
                lat: el.lat,
                lng: el.lon,
                petFriendly: isPetFriendly,
                clue: `The Key is near latitude ${lat.toFixed(2)}.`
              });
            }
          });
        }

        if (locations.length < 5) {
          locations = [
            { id: 1, name: "City Art Gallery", type: "gallery", lat: lat + 0.003, lng: lng + 0.002, petFriendly: true, clue: "Key is near water or a park." },
            { id: 2, name: "Central Bistro", type: "restaurant", lat: lat - 0.002, lng: lng + 0.004, petFriendly: false, clue: "Key is south of the city center." },
            { id: 3, name: "History Museum", type: "museum", lat: lat + 0.005, lng: lng - 0.003, petFriendly: true, clue: "Look towards higher numbered streets." },
            { id: 4, name: "Community Academy", type: "school", lat: lat - 0.004, lng: lng - 0.002, petFriendly: false, clue: "Key lies near an eastern block." }
          ];
        }

        const keyIndex = Math.floor(Math.random() * locations.length);
        goldenKeyLocation = locations[keyIndex].id;

        locations.forEach(loc => {
          const marker = L.marker([loc.lat, loc.lng]).addTo(map);
          marker.bindPopup(`<b>${loc.name}</b><br>Type: ${loc.type}<br><button onclick="interactWithLocation(${loc.id})">Enter Location</button>`);
        });

      } catch (err) {
        log("Loaded city businesses for exploration.", false);
      }
    }

    function startGame() {
      if(!player.lat) return alert("Please load a city first!");

      player.name = document.getElementById('player-name').value || "Explorer1";
      player.transport = document.getElementById('transport-select').value;
      player.hasDog = document.getElementById('dog-checkbox').checked;
      player.voiceGender = document.getElementById('voice-gender-select').value;

      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('game-controls').style.display = 'block';
      document.getElementById('stats-card').style.display = 'block';
      document.getElementById('leaderboard-card').style.display = 'block';

      if(player.hasDog) {
        document.getElementById('dog-stat-container').style.display = 'block';
      }

      gameActive = true;
      updateUI();
      log(`Welcome ${player.name}! I am your guide. Roll the die to begin exploring your city!`);
    }

    function rollDice() {
      if(!gameActive) return;

      if(player.inJailTurns > 0) {
        player.inJailTurns--;
        log(`You are in Jail. You must wait turn. Turns remaining: ${player.inJailTurns}`);
        return;
      }

      if(player.isStudyingTurns > 0) {
        player.isStudyingTurns--;
        log(`You are studying at school to reveal clues. Skipping turn.`);
        return;
      }

      const roll = Math.floor(Math.random() * 6) + 1;
      let bonus = player.transport === 'car' ? 2 : player.transport === 'bike' ? 1 : 0;
      movesRemaining = roll + bonus;

      log(`You rolled a ${roll}! You have ${movesRemaining} total moves.`);
      
      document.getElementById('roll-btn').disabled = true;
      document.getElementById('alley-btn').disabled = false;
      document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;

      drainLife(5);
    }

    function drainLife(amount) {
      player.health = Math.max(0, player.health - amount);
      if(player.hasDog) {
        player.dogHydration = Math.max(0, player.dogHydration - (amount * 1.5));
      }

      if(player.health <= 20 && player.health > 0) {
        speak("Warning: Your life stamina is getting low! Stop at a local business to eat and replenish.");
      }

      if(player.health <= 0) {
        log(`You collapsed from fatigue! Returning home to recover.`);
        resetToHome();
      }

      if(player.hasDog && player.dogHydration <= 0) {
        log(`Your dog is too thirsty to continue! Heading back home.`);
        resetToHome();
      }

      updateUI();
    }

    function resetToHome() {
      player.health = 100;
      player.dogHydration = 100;
      userMarker.setLatLng([player.lat, player.lng]);
      map.panTo([player.lat, player.lng]);
      movesRemaining = 0;
      document.getElementById('roll-btn').disabled = false;
      document.getElementById('alley-btn').disabled = true;
      updateUI();
    }

    let activeEncounterLoc = null;

    window.interactWithLocation = function(locId) {
      if(movesRemaining <= 0) {
        speak("You need remaining moves from a dice roll to enter this place.");
        return alert("You need remaining moves from a dice roll to reach/enter this business!");
      }

      const loc = locations.find(l => l.id === locId);
      if(!loc) return;

      activeEncounterLoc = loc;

      if(player.hasDog && !loc.petFriendly) {
        log(`${loc.name} is not pet-friendly! Your dog cannot enter.`);
        return;
      }

      userMarker.setLatLng([loc.lat, loc.lng]);
      movesRemaining--;
      player.points += 10;
      player.tokens += 5;

      document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;
      if(movesRemaining === 0) {
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('alley-btn').disabled = true;
      }

      document.getElementById('modal-title').innerText = loc.name;
      document.getElementById('modal-type').innerText = `Type: ${loc.type.toUpperCase()} | ${loc.petFriendly ? '🐾 Pet Friendly' : 'No Pets'}`;
      document.getElementById('dog-water-btn').style.display = player.hasDog ? 'block' : 'none';
      document.getElementById('encounter-modal').style.display = 'flex';

      speak(`You arrived at ${loc.name}. Would you like to open the door and search inside, or rest and replenish?`);
      updateUI();
    };

    function openDoor() {
      if(!activeEncounterLoc) return;

      if(activeEncounterLoc.id === goldenKeyLocation) {
        log(`Congratulations! You opened the door at ${activeEncounterLoc.name} and found the GOLDEN KEY! You win!`);
        player.points += 500;
        gameActive = false;
      } else {
        log(`No key behind this door. Here is your clue: ${activeEncounterLoc.clue}`);
      }
      closeModal();
    }

    function visitRestroomOrEat() {
      if(player.tokens < 10) {
        speak("You don't have enough tokens to buy food.");
        return alert("Not enough tokens!");
      }
      player.tokens -= 10;
      player.health = Math.min(100, player.health + 40);
      log(`You stopped to rest and eat. Life restored to ${player.health} percent.`);
      updateUI();
      closeModal();
    }

    function hydrateDog() {
      player.dogHydration = 100;
      log(`You gave your dog fresh water! Dog hydration fully restored.`);
      updateUI();
      closeModal();
    }

    function studyAtSchool() {
      player.isStudyingTurns = 1;
      log(`You enrolled to study. You skip your next turn, but learn useful clues.`);
      closeModal();
    }

    function takeDarkAlleyShortcut() {
      if(movesRemaining <= 0) return;

      const risk = Math.random();

      if(risk < 0.4) {
        log(`You were ambushed in a dark alley! You lost 20 tokens and were sent home.`);
        player.tokens = Math.max(0, player.tokens - 20);
        resetToHome();
      } else {
        log(`Shortcut successful! You gained two extra moves.`);
        movesRemaining += 2;
        document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;
      }
    }

    function closeModal() {
      document.getElementById('encounter-modal').style.display = 'none';
    }

    function updateUI() {
      document.getElementById('score-val').innerText = player.points;
      document.getElementById('token-val').innerText = player.tokens;
      
      const hBar = document.getElementById('health-bar');
      hBar.style.width = player.health + '%';
      if(player.health < 30) hBar.classList.add('low');
      else hBar.classList.remove('low');

      if(player.hasDog) {
        document.getElementById('dog-bar').style.width = player.dogHydration + '%';
      }

      document.getElementById('leaderboard-list').innerHTML = `<li>${player.name} - ${player.points} pts (Tokens: ${player.tokens})</li>`;
    }
  </script>
</body>
</html>
