<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITY KEY QUEST</title>

  <!-- Leaflet CSS & JS (100% Free & Open-Source - NO API KEYS REQUIRED) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: rgba(15, 22, 36, 0.82);
      --panel-border: rgba(255, 215, 0, 0.25);
      --accent-gold: #ffd700;
      --accent-gold-glow: #ffb700;
      --accent-cyan: #00f2fe;
      --accent-blue: #0088ff;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --danger-red: #ff4757;
      --success-green: #2ed573;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-window {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #06090e;
      z-index: 1;
    }

    .leaflet-tile {
      filter: brightness(0.65) contrast(1.25) saturate(0.7) hue-rotate(200deg);
    }

    .top-header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      padding: 10px 28px;
      border-radius: 40px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.15);
    }

    .header-key {
      font-size: 1.8rem;
      color: var(--accent-gold);
      filter: drop-shadow(0 0 8px var(--accent-gold-glow));
    }

    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #ffffff 30%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ui-panel {
      position: absolute;
      z-index: 1000;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #e2e8f0;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #left-sidebar {
      top: 20px;
      left: 20px;
      width: 310px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .gender-toggle {
      display: flex;
      gap: 8px;
    }

    .gender-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-sub);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .gender-btn.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      width: 70px;
    }

    input, select {
      flex: 1;
      background: rgba(5, 10, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 10px;
      color: white;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, #ffc800 0%, #ff9000 100%);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(255, 180, 0, 0.3);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-start:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .stat-bar-container {
      margin-bottom: 8px;
    }

    .stat-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .vertical-stats {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 60px;
      margin-top: 10px;
    }

    .v-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .v-bar-bg {
      width: 16px;
      height: 45px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .v-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-cyan);
      border-radius: 8px;
      transition: height 0.3s ease;
    }

    #log-box {
      font-size: 0.75rem;
      line-height: 1.4;
      color: #cbd5e1;
      max-height: 110px;
      overflow-y: auto;
    }

    .log-line {
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    #action-menu {
      top: 100px;
      right: 20px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .action-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-gold);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #dice-section {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .roll-orb-container {
      position: relative;
      cursor: pointer;
    }

    .roll-orb {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, rgba(10, 15, 25, 0.9) 80%);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      color: var(--accent-gold);
      transition: all 0.3s ease;
    }

    .roll-label {
      position: absolute;
      right: -55px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid var(--accent-gold);
      padding: 6px 16px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: white;
      font-size: 0.9rem;
    }

    .moves-tag {
      background: rgba(10, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent-cyan);
      padding: 10px 20px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .moves-tag strong {
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #0d1322;
      border: 1px solid var(--accent-gold);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
    }
  </style>
</head>
<body>

  <div id="game-window">
    <div class="top-header">
      <i class="fa-solid fa-key header-key"></i>
      <span class="header-title">CITY KEY QUEST</span>
    </div>

    <div id="map"></div>

    <div class="ui-panel" id="left-sidebar">
      
      <div>
        <div class="panel-title">YOUR GUIDE: GENDER</div>
        <div class="gender-toggle">
          <button class="gender-btn active" id="btn-female" onclick="setGender('female')">
            <i class="fa-solid fa-venus" style="font-size: 1.2rem;"></i>
            FEMALE
          </button>
          <button class="gender-btn" id="btn-male" onclick="setGender('male')">
            <i class="fa-solid fa-mars" style="font-size: 1.2rem;"></i>
            MALE
          </button>
        </div>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
        <div class="panel-title">PLAYER SETUP</div>
        
        <div class="input-group">
          <span class="input-label">Name</span>
          <input type="text" id="player-name-input" value="Explorer1">
        </div>

        <div class="input-group">
          <span class="input-label">ZIP/City</span>
          <input type="text" id="zip-input" value="23185">
        </div>

        <div class="input-group">
          <span class="input-label">Transport</span>
          <select id="transport-input">
            <option value="walk">🚶 Walking</option>
            <option value="bike">🚲 Bike (+1)</option>
            <option value="car">🚗 Car (+2)</option>
          </select>
        </div>

        <div class="input-group">
          <span class="input-label">Bring Dog</span>
          <input type="checkbox" id="dog-checkbox" onchange="toggleDogNameInput()" style="width: auto;">
          <input type="text" id="dog-name-input" placeholder="Dog's Name" value="Buddy" style="display:none; margin-left:6px;">
        </div>

        <button class="btn-start" onclick="initGame()">START GAME</button>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
        <div class="panel-title">LIVE STATS</div>
        <div class="vertical-stats">
          <div class="v-stat">
            <div class="v-bar-bg"><div class="v-bar-fill" id="bar-points" style="height: 40%; background: var(--accent-gold);"></div></div>
            <i class="fa-solid fa-star" style="color:var(--accent-gold); font-size:0.8rem;"></i>
            <span style="font-size:0.65rem; color:var(--text-sub);">Points</span>
          </div>
          <div class="v-stat">
            <div class="v-bar-bg"><div class="v-bar-fill" id="bar-tokens" style="height: 60%; background: var(--accent-cyan);"></div></div>
            <i class="fa-solid fa-coins" style="color:var(--accent-cyan); font-size:0.8rem;"></i>
            <span style="font-size:0.65rem; color:var(--text-sub);">Tokens</span>
          </div>
          <div class="v-stat">
            <div class="v-bar-bg"><div class="v-bar-fill" id="bar-life" style="height: 100%; background: var(--danger-red);"></div></div>
            <i class="fa-solid fa-heart" style="color:var(--danger-red); font-size:0.8rem;"></i>
            <span style="font-size:0.65rem; color:var(--text-sub);">Life</span>
          </div>
          <div class="v-stat" id="dog-stat-column" style="display: none;">
            <div class="v-bar-bg"><div class="v-bar-fill" id="bar-dog" style="height: 100%; background: #00c6ff;"></div></div>
            <i class="fa-solid fa-droplet" style="color:#00c6ff; font-size:0.8rem;"></i>
            <span style="font-size:0.65rem; color:var(--text-sub);" id="dog-stat-label">Dog</span>
          </div>
        </div>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; flex:1;">
        <div class="panel-title">
          <span>ACTIVITY LOG</span>
          <i class="fa-solid fa-comment-dots" style="color:var(--accent-cyan);"></i>
        </div>
        <div id="log-box"></div>
      </div>

    </div>

    <div class="ui-panel" id="action-menu">
      <button class="action-btn" onclick="openLocationEncounter()">
        <i class="fa-solid fa-location-dot" style="color:var(--accent-cyan);"></i>
        Enter Location
      </button>
      <button class="action-btn" onclick="replenishFoodWater()">
        <i class="fa-solid fa-utensils" style="color:var(--accent-gold);"></i>
        Find Food & Water
      </button>
      <button class="action-btn" onclick="studyAtSchool()">
        <i class="fa-solid fa-graduation-cap" style="color:#a855f7;"></i>
        Go to School
      </button>
      <button class="action-btn" onclick="darkAlleyShortcut()">
        <i class="fa-solid fa-user-ninja" style="color:var(--text-sub);"></i>
        Dark Alley Shortcut
      </button>
    </div>

    <div id="dice-section">
      <div class="roll-orb-container" onclick="rollDice()">
        <div class="roll-orb" id="dice-orb">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div class="roll-label">Roll</div>
      </div>
      <div class="moves-tag">Moves Left: <strong id="moves-count">0</strong></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-screen">
    <div class="modal-card">
      <h3 id="modal-heading" style="color:var(--accent-gold); font-family:'Orbitron'; margin-bottom:12px;">Doorways</h3>
      <p id="modal-body" style="color:#cbd5e1; font-size:0.85rem; line-height:1.4; margin-bottom:18px;"></p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="action-btn" onclick="searchForGoldenKey()" style="background:rgba(255,215,0,0.15); border-color:var(--accent-gold);">
          <i class="fa-solid fa-door-open" style="color:var(--accent-gold);"></i> Open Door & Search
        </button>
        <button class="action-btn" onclick="closeModal()">Leave</button>
      </div>
    </div>
  </div>

  <script>
    let map, userMarker;
    let selectedGender = 'female';
    let availableVoices = [];
    let gameStarted = false;
    let movesLeft = 0;

    let gameState = {
      name: 'Explorer1',
      zip: '23185',
      hasDog: false,
      dogName: 'Buddy',
      transport: 'walk',
      points: 0,
      tokens: 50,
      life: 100,
      dogHydration: 100,
      lat: 37.2707,
      lng: -76.7075
    };

    function initMap(lat, lng) {
      if(map) map.remove();
      map = L.map('map', { zoomControl: false }).setView([lat, lng], 15);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      const playerIcon = L.divIcon({
        html: '<i class="fa-solid fa-child-reaching" style="color:#ffd700; font-size: 28px; filter: drop-shadow(0 0 10px #ffd700);"></i>',
        className: 'custom-pin'
      });
      userMarker = L.marker([lat, lng], {icon: playerIcon}).addTo(map);
    }

    function setGender(gender) {
      selectedGender = gender;
      document.getElementById('btn-female').classList.toggle('active', gender === 'female');
      document.getElementById('btn-male').classList.toggle('active', gender === 'male');
      speak(`Voice set to ${gender}.`);
    }

    function toggleDogNameInput() {
      const isChecked = document.getElementById('dog-checkbox').checked;
      document.getElementById('dog-name-input').style.display = isChecked ? 'block' : 'none';
      document.getElementById('dog-stat-column').style.display = isChecked ? 'flex' : 'none';
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = selectedGender === 'female' ? 1.1 : 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function addLog(text) {
      const logBox = document.getElementById('log-box');
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `> ${text}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function initGame() {
      gameState.name = document.getElementById('player-name-input').value || 'Explorer1';
      gameState.zip = document.getElementById('zip-input').value || '23185';
      gameState.hasDog = document.getElementById('dog-checkbox').checked;
      gameState.dogName = document.getElementById('dog-name-input').value || 'Buddy';
      gameState.transport = document.getElementById('transport-input').value;

      document.getElementById('dog-stat-label').innerText = gameState.dogName;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(gameState.zip)}`);
        const data = await res.json();
        if(data && data.length > 0) {
          gameState.lat = parseFloat(data[0].lat);
          gameState.lng = parseFloat(data[0].lon);
        }
      } catch(e) {}

      initMap(gameState.lat, gameState.lng);
      gameStarted = true;
      
      const msg = `Welcome ${gameState.name}! Your map for area ${gameState.zip} is rendered. Roll to move!`;
      addLog(msg);
      speak(msg);
    }

    function rollDice() {
      if(!gameStarted) return alert("Please click 'START GAME' first!");

      const roll = Math.floor(Math.random() * 6) + 1;
      let bonus = gameState.transport === 'car' ? 2 : gameState.transport === 'bike' ? 1 : 0;
      movesLeft = roll + bonus;

      document.getElementById('moves-count').innerText = movesLeft;
      const msg = `You rolled a ${roll} (+${bonus} vehicle bonus).`;
      addLog(msg);
      speak(msg);

      gameState.life = Math.max(0, gameState.life - 5);
      if(gameState.hasDog) gameState.dogHydration = Math.max(0, gameState.dogHydration - 8);
      updateBars();
    }

    function updateBars() {
      document.getElementById('bar-life').style.height = gameState.life + '%';
      if(gameState.hasDog) {
        document.getElementById('bar-dog').style.height = gameState.dogHydration + '%';
      }
    }

    function openLocationEncounter() {
      if(movesLeft <= 0) return alert("Roll the die to gain moves first!");
      movesLeft--;
      document.getElementById('moves-count').innerText = movesLeft;

      document.getElementById('modal-heading').innerText = "Local Business Doorway";
      document.getElementById('modal-body').innerText = "You stand outside the entrance. Would you like to open the door and search inside for the Golden Key?";
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function searchForGoldenKey() {
      addLog("You searched behind the door and found a riddle clue!");
      closeModal();
    }

    function replenishFoodWater() {
      gameState.life = 100;
      if(gameState.hasDog) gameState.dogHydration = 100;
      updateBars();
      addLog("Restored health stamina and dog hydration!");
      speak("Stamina restored!");
    }

    function studyAtSchool() {
      addLog("Studying clues at the local academy. Next turn skipped.");
    }

    function darkAlleyShortcut() {
      movesLeft += 2;
      document.getElementById('moves-count').innerText = movesLeft;
      addLog("Took a dark alley shortcut! Gain +2 moves.");
    }

    function closeModal() {
      document.getElementById('modal-screen').style.display = 'none';
    }

    window.onload = () => {
      initMap(gameState.lat, gameState.lng);
      addLog("System Ready. Enter your ZIP or City name and press START GAME.");
    };
  </script>
</body>
</html>
