<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Virtual Hair Styler & Color Studio</title>
  
  <!-- MediaPipe Selfie Segmentation via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-border: #23304d;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }

    h1 { font-size: 1.8rem; color: #a78bfa; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* Layout Grid */
    .app-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 850px) {
      .app-container { grid-template-columns: 1fr 360px; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    /* Viewport Area */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .mirror { transform: scaleX(-1); }

    /* Split Slider Controls */
    .slider-container {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 3px;
      background: #ffffff;
      cursor: ew-resize;
      z-index: 10;
    }

    .slider-button {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px;
      background: #8b5cf6;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
    }

    /* Tabs & Controls */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .section-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    /* Color Swatches Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .color-swatch:hover { transform: scale(1.08); }
    .color-swatch.selected { border-color: #ffffff; transform: scale(1.1); }

    /* Hairstyle Preset Grid */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .style-card {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .style-card:hover, .style-card.selected {
      border-color: var(--accent);
      background: #1e1b4b;
      color: #c4b5fd;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; margin-top: 8px; }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>AI Virtual Hair Studio</h1>
    <p class="subtitle">Real-Time Hair Color Dye & Generative Style Transformation</p>
  </header>

  <div class="app-container">
    <!-- Viewport Column -->
    <div class="card">
      <div class="viewport">
        <video id="webcam" class="mirror" playsinline></video>
        <canvas id="outputCanvas" class="mirror"></canvas>
      </div>
      <button id="snapBtn" class="btn btn-secondary">Download Styled Snapshot</button>
    </div>

    <!-- Control Panel Column -->
    <div class="card">
      <!-- Mode Tabs -->
      <div class="tab-group">
        <button id="tabColor" class="tab-btn active">1. Color Dye</button>
        <button id="tabStyle" class="tab-btn">2. Style Generator</button>
      </div>

      <!-- MODE 1: COLOR DYE CONTROLS -->
      <div id="colorPanel">
        <div class="section-title">Select Hair Color</div>
        <div class="color-grid">
          <div class="color-swatch selected" style="background: #e2b070;" data-color="rgba(226, 176, 112, " data-name="Blonde"></div>
          <div class="color-swatch" style="background: #8d2e16;" data-color="rgba(141, 46, 22, " data-name="Auburn"></div>
          <div class="color-swatch" style="background: #ec4899;" data-color="rgba(236, 72, 153, " data-name="Pink"></div>
          <div class="color-swatch" style="background: #10b981;" data-color="rgba(16, 185, 129, " data-name="Emerald"></div>
          <div class="color-swatch" style="background: #3b82f6;" data-color="rgba(59, 130, 246, " data-name="Cobalt"></div>
          <div class="color-swatch" style="background: #111827;" data-color="rgba(17, 24, 39, " data-name="Jet Black"></div>
          <div class="color-swatch" style="background: #a855f7;" data-color="rgba(168, 85, 247, " data-name="Purple"></div>
          <div class="color-swatch" style="background: #f97316;" data-color="rgba(249, 115, 22, " data-name="Copper"></div>
        </div>

        <div class="control-group">
          <label>Dye Intensity <span id="opacityVal">60%</span></label>
          <input type="range" id="opacitySlider" min="10" max="90" value="60">
        </div>

        <div class="control-group">
          <label>Shine & Luminance <span id="shineVal">40%</span></label>
          <input type="range" id="shineSlider" min="0" max="100" value="40">
        </div>
      </div>

      <!-- MODE 2: STYLE GENERATOR CONTROLS -->
      <div id="stylePanel" style="display: none;">
        <div class="section-title">Select Style Preset</div>
        <div class="style-grid">
          <div class="style-card selected" data-style="buzzcut">Buzz Cut</div>
          <div class="style-card" data-style="longwavy">Long Wavy</div>
          <div class="style-card" data-style="afro">Afro Volume</div>
          <div class="style-card" data-style="bob">Chic Bob</div>
          <div class="style-card" data-style="curlyfringe">Curly Fringe</div>
          <div class="style-card" data-style="pixie">Short Pixie</div>
        </div>

        <div class="control-group">
          <label>Hair Volume Offset <span id="volVal">1.0x</span></label>
          <input type="range" id="volSlider" min="5" max="20" value="10">
        </div>

        <button id="generateBtn" class="btn">Generate AI Hairstyle</button>
      </div>

    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    // UI Controls
    const tabColor = document.getElementById('tabColor');
    const tabStyle = document.getElementById('tabStyle');
    const colorPanel = document.getElementById('colorPanel');
    const stylePanel = document.getElementById('stylePanel');

    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const shineSlider = document.getElementById('shineSlider');
    const shineVal = document.getElementById('shineVal');
    const volSlider = document.getElementById('volSlider');
    const volVal = document.getElementById('volVal');

    const snapBtn = document.getElementById('snapBtn');
    const generateBtn = document.getElementById('generateBtn');

    // State
    let activeMode = 'color'; // 'color' or 'style'
    let currentColorBase = 'rgba(226, 176, 112, ';
    let dyeOpacity = 0.6;
    let selectedStyle = 'buzzcut';

    // Tab Switching
    tabColor.addEventListener('click', () => {
      activeMode = 'color';
      tabColor.classList.add('active');
      tabStyle.classList.remove('active');
      colorPanel.style.display = 'block';
      stylePanel.style.display = 'none';
    });

    tabStyle.addEventListener('click', () => {
      activeMode = 'style';
      tabStyle.classList.add('active');
      tabColor.classList.remove('active');
      stylePanel.style.display = 'block';
      colorPanel.style.display = 'none';
    });

    // Swatch Selection
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        currentColorBase = swatch.getAttribute('data-color');
      });
    });

    // Style Selection
    document.querySelectorAll('.style-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedStyle = card.getAttribute('data-style');
      });
    });

    // Slider Listeners
    opacitySlider.addEventListener('input', (e) => {
      dyeOpacity = e.target.value / 100;
      opacityVal.innerText = `${e.target.value}%`;
    });

    shineSlider.addEventListener('input', (e) => {
      shineVal.innerText = `${e.target.value}%`;
    });

    volSlider.addEventListener('input', (e) => {
      volVal.innerText = `${(e.target.value / 10).toFixed(1)}x`;
    });

    // MediaPipe Callback
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Draw Base Camera Image
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.segmentationMask && activeMode === 'color') {
        // Create an off-screen mask canvas for hair processing
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvasElement.width;
        maskCanvas.height = canvasElement.height;
        const maskCtx = maskCanvas.getContext('2d');

        // Draw segmentation mask
        maskCtx.drawImage(results.segmentationMask, 0, 0, maskCanvas.width, maskCanvas.height);

        // Composite Color Dye
        canvasCtx.globalCompositeOperation = 'soft-light';
        canvasCtx.fillStyle = `${currentColorBase}${dyeOpacity})`;
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        canvasCtx.globalCompositeOperation = 'destination-in';
        canvasCtx.drawImage(maskCanvas, 0, 0);

        canvasCtx.restore();

        // Redraw base video beneath blending layers
        canvasCtx.globalCompositeOperation = 'destination-over';
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      } else {
        canvasCtx.restore();
      }
    }

    // Initialize MediaPipe Selfie Segmentation
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1, // 1 for landscape/high precision
    });

    selfieSegmentation.onResults(onResults);

    // Initialize Camera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await selfieSegmentation.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().catch(err => {
      alert("Camera access required for live hair try-on.");
      console.error(err);
    });

    // Download Snapshot
    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'my-new-hairstyle.png';
      link.href = canvasElement.toDataURL();
      link.click();
    });

    // AI Generation Simulator
    generateBtn.addEventListener('click', () => {
      alert(`AI Model Request: Generating '${selectedStyle}' style texture layer. In a production build, this captures a frame and sends it to a Replicate/Stable Diffusion API endpoint.`);
    });
  </script>
</body>
</html>
