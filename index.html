<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Best Friends to Boyfriends - Community & Profiles</title>
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary-dark);
        }

        .tagline {
            margin: 4px 0 0 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-buttons .btn {
            padding: 8px 16px;
            margin-left: 10px;
            border-radius: 6px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .nav-buttons .btn-primary {
            background: var(--primary);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .category-header-title {
            background: #f8f9fa;
            padding: 10px 15px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .profile-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #eee;
        }

        .profile-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .profile-title {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .profile-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            flex-grow: 1;
        }

        .btn-connect {
            width: 100%;
            padding: 10px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        #imgPreview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <h1>Best Friends to Boyfriends</h1>
            <div class="tagline">From best friends to boyfriends we have you covered</div>
        </div>
        <div class="nav-buttons">
            <button class="btn" onclick="openModal('userModal', 'login')">Log In</button>
            <button class="btn btn-primary" onclick="openModal('userModal', 'register')">Create Profile</button>
        </div>
    </header>

    <div class="container">
        <h2>Connect & Meet Up</h2>
        <div id="live-members-container" class="grid-container">
            <!-- Profiles dynamically render here -->
        </div>
    </div>

    <!-- Auth & Profile Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('userModal')">&times;</button>
            
            <div class="tab-buttons">
                <button id="tabLoginBtn" class="tab-btn active" onclick="toggleAuthMode('login')">Log In</button>
                <button id="tabRegisterBtn" class="tab-btn" onclick="toggleAuthMode('register')">Create Profile</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-connect">Log In</button>
            </form>

            <!-- Register / Profile Creation Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label>Your Name & Pet's Name</label>
                    <input type="text" id="regName" placeholder="e.g., Alex & Buster" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>Preferred Date Category</label>
                    <select id="regGoal" required>
                        <option value="" disabled selected>Select an activity style...</option>
                        <optgroup label="No Cost Dates">
                            <option value="Dog Walk Date">Dog Walk Date</option>
                            <option value="Meet with Friends">Meet with Friends</option>
                            <option value="Bike Ride Dates">Bike Ride Dates</option>
                            <option value="Meet in the Park">Meet in the Park</option>
                            <option value="Picnic Dates">Picnic Dates</option>
                            <option value="Running / Gym Date">Running or Exercise Dates at the Gym</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>Profile Photo</label>
                    <input type="file" id="regPhoto" accept="image/*" onchange="previewImage(event)" required>
                    <img id="imgPreview" alt="Profile Preview">
                </div>
                <div class="form-group">
                    <label>Public Bio / About You</label>
                    <textarea id="regDetails" placeholder="Share a little about yourself and what you're looking for..." required></textarea>
                </div>
                <button type="submit" id="regSubmitBtn" class="btn-connect">Create Public Profile</button>
            </form>
        </div>
    </div>

    <script>
        // Insert your Firebase project configuration here
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let base64PhotoStr = "";

        // Client-side Image Resizing & Base64 Compression
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxW = 400;
                        const scale = maxW / img.width;
                        canvas.width = maxW;
                        canvas.height = img.height * scale;

                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        base64PhotoStr = canvas.toDataURL('image/jpeg', 0.7);
                        
                        const imgPreview = document.getElementById('imgPreview');
                        imgPreview.src = base64PhotoStr;
                        imgPreview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        // Modal Controls
        function openModal(modalId, mode = 'login') {
            document.getElementById(modalId).style.display = 'flex';
            if (modalId === 'userModal') toggleAuthMode(mode);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function toggleAuthMode(mode) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');

            if (mode === 'login') {
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                tabReg.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert("Successfully logged in!");
                closeModal('userModal');
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        }

        // Handle Registration & Save Profile
        async function handleRegistration(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('regSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Creating Profile...";

            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const names = document.getElementById('regName').value;
            const goal = document.getElementById('regGoal').value;
            const details = document.getElementById('regDetails').value;

            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                
                await db.collection("profiles").doc(userCred.user.uid).set({
                    uid: userCred.user.uid,
                    names: names,
                    email: email,
                    goal: goal,
                    details: details,
                    photoUrl: base64PhotoStr,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Profile created successfully!");
                closeModal('userModal');
                loadLiveProfiles();
            } catch (error) {
                alert("Error creating profile: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Public Profile";
            }
        }

        // Fetch & Render Live Profiles
        function loadLiveProfiles() {
            db.collection("profiles").orderBy("createdAt", "desc").limit(20).onSnapshot((snapshot) => {
                const container = document.getElementById('live-members-container');
                if (snapshot.empty) {
                    container.innerHTML = `<p style="color: #666; padding: 10px;">No profiles available yet. Be the first to post!</p>`;
                    return;
                }
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const profile = doc.data();
                    container.innerHTML += `
                        <div class="category-item-card">
                            <div class="category-header-title">📍 ${profile.goal}</div>
                            <img src="${profile.photoUrl || 'https://via.placeholder.com/400x220?text=No+Photo'}" class="profile-img" alt="${profile.names}">
                            <div class="profile-body">
                                <h3 class="profile-title">${profile.names}</h3>
                                <p class="profile-desc">${profile.details}</p>
                                <button class="btn-connect" onclick="alert('Sending connection request to ${profile.names}...')">Send Hello 🐾</button>
                            </div>
                        </div>
                    `;
                });
            }, (error) => {
                console.log("Firestore fetch notice: Connect Firebase configuration to populate live records.");
            });
        }

        window.onload = function() {
            loadLiveProfiles();
        };
    </script>
</body>
</html>
