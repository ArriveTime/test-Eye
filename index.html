<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ArriveTime.com — Live Arrival & ETA Tracker</title>

  <!-- Leaflet Maps CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase Compatibility Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Leaflet Maps JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --family-color: #ef4444;
      --friends-color: #10b981;
      --business-color: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100vw;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Map Interface */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Sidebar Interface */
    #sidebar {
      width: 380px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--card-border);
      z-index: 10;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .group-section {
      margin-bottom: 24px;
    }

    .group-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Cards & Lists */
    .person-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .person-card:hover, .person-card.active {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 2px solid transparent;
    }

    .person-info {
      flex: 1;
    }

    .person-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .person-eta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .eta-time {
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Floating Banners & Overlays */
    #arrivalBanner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 24px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    #arrivalBanner.visible {
      display: flex;
    }

    .banner-time {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Primary Actions & Buttons */
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    /* Modal System */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* Map Custom Markers */
    .leaflet-marker-icon {
      border: none;
      background: none;
    }

    .map-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      border: 2px solid white;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 200;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      #app-container {
        flex-direction: column-reverse;
      }
      #sidebar {
        width: 100%;
        height: 45vh;
      }
      #map {
        height: 55vh;
      }
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Left Navigation / Roster Sidebar -->
  <div id="sidebar">
    <div class="header">
      <div class="brand">📍 ArriveTime</div>
      <button class="btn" onclick="openModal()">+ Track Person</button>
    </div>
    
    <div class="content-area">
      <!-- Family Group -->
      <div class="group-section">
        <div class="group-title">
          <span style="color: var(--family-color);">●</span> Family
        </div>
        <div id="family-list"></div>
      </div>

      <!-- Friends Group -->
      <div class="group-section">
        <div class="group-title">
          <span style="color: var(--friends-color);">●</span> Friends
        </div>
        <div id="friends-list"></div>
      </div>

      <!-- Business Group -->
      <div class="group-section">
        <div class="group-title">
          <span style="color: var(--business-color);">●</span> Business
        </div>
        <div id="business-list"></div>
      </div>
    </div>
  </div>

  <!-- Interactive Map Workspace -->
  <div id="map"></div>

  <!-- Top Active ETA Banner -->
  <div id="arrivalBanner">
    <div>
      <div id="bannerName" style="font-weight: 600;">Select a contact</div>
      <div id="bannerSub" style="font-size: 0.8rem; color: var(--muted);">Select someone from the list to track</div>
    </div>
    <div id="bannerEta" class="banner-time">-- min</div>
  </div>
</div>

<!-- Modal for Adding Trackers -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">Track New Person</div>
    
    <div class="form-group">
      <label for="addName">Name</label>
      <input type="text" id="addName" placeholder="e.g. Alex Morgan" />
    </div>

    <div class="form-group">
      <label for="addGroup">Category</label>
      <select id="addGroup">
        <option value="family">Family</option>
        <option value="friends">Friends</option>
        <option value="business">Business</option>
      </select>
    </div>

    <div class="form-group">
      <label for="addEmoji">Icon / Emoji</label>
      <select id="addEmoji">
        <option value="🚗">🚗 Car</option>
        <option value="🏃">🏃 Walking</option>
        <option value="🚴">🚴 Bicycle</option>
        <option value="✈️">✈️ Flight</option>
        <option value="💼">💼 Business</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="addPersonSubmit()">Start Tracking</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════
//  CONFIG & INITIALIZATION
// ══════════════════════════════
const firebaseConfig = {
  databaseURL: "https://arrivetime-default-rtdb.firebaseio.com" // Replace with your Firebase RTDB URL
};

// Fallback session ID generator or URL query parser
const urlParams = new URLSearchParams(window.location.search);
const SESSION_ID = urlParams.get('session') || 'demo-room';

let database;
let map;
let myMarker;
let myLat = null;
let myLng = null;
let people = {};
let selectedPerson = null;

const GROUP_COLORS = {
  family: '#ef4444',
  friends: '#10b981',
  business: '#3b82f6'
};

// Initialize Application
window.addEventListener('load', () => {
  initFirebase();
  initMap();
  setupGeolocation();
});

function initFirebase() {
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  database = firebase.database();
  
  // Listen for real-time room sync
  database.ref('sessions/' + SESSION_ID + '/users').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    syncPeopleData(data);
  });
}

function initMap() {
  // Default centered at center of US prior to GPS lock
  map = L.map('map', { zoomControl: false }).setView([37.7749, -122.4194], 12);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);
}

// ══════════════════════════════
//  GEOLOCATION & LIVE UPDATES
// ══════════════════════════════
function setupGeolocation() {
  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
      (position) => {
        myLat = position.coords.latitude;
        myLng = position.coords.longitude;

        if (!myMarker) {
          map.setView([myLat, myLng], 13);
          const customIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div class="map-avatar" style="background:#38bdf8; border-color:#fff;">📍</div>`
          });
          myMarker = L.marker([myLat, myLng], { icon: customIcon }).addTo(map);
        } else {
          myMarker.setLatLng([myLat, myLng]);
        }

        updateAllETAs();
      },
      (error) => {
        console.warn('Geolocation error or permission denied:', error);
      },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
    );
  }
}

function syncPeopleData(remoteUsers) {
  Object.keys(remoteUsers).forEach(id => {
    const p = remoteUsers[id];
    
    if (!people[id]) {
      people[id] = p;
      createMapMarker(people[id]);
    } else {
      people[id].lat = p.lat;
      people[id].lng = p.lng;
      people[id].name = p.name;
      people[id].group = p.group;
      people[id].emoji = p.emoji;
      
      if (people[id].marker) {
        people[id].marker.setLatLng([p.lat, p.lng]);
      }
    }
  });

  // Remove stale trackers
  Object.keys(people).forEach(id => {
    if (!remoteUsers[id]) {
      if (people[id].marker) map.removeLayer(people[id].marker);
      delete people[id];
    }
  });

  updateAllETAs();
}

function createMapMarker(p) {
  const color = GROUP_COLORS[p.group] || '#38bdf8';
  const icon = L.divIcon({
    className: 'custom-pin',
    html: `<div class="map-avatar" style="background:${color}; border-color:#fff;">${p.emoji}</div>`
  });

  p.marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
  p.marker.on('click', () => selectPerson(p));
}

function createPersonIcon(p) {
  const color = GROUP_COLORS[p.group] || '#38bdf8';
  return L.divIcon({
    className: 'custom-pin',
    html: `<div class="map-avatar" style="background:${color}; border-color:#fff;">${p.emoji}</div>`
  });
}

// ══════════════════════════════
//  MODALS & FORM HANDLERS
// ══════════════════════════════
function openModal() {
  document.getElementById('addModal').classList.add('visible');
  document.getElementById('addName').focus();
}

function closeModal() {
  document.getElementById('addModal').classList.remove('visible');
  document.getElementById('addName').value = '';
}

function addPersonSubmit() {
  const name = document.getElementById('addName').value.trim();
  const group = document.getElementById('addGroup').value;
  const emoji = document.getElementById('addEmoji').value;

  if (!name) { 
    document.getElementById('addName').focus(); 
    return; 
  }

  const personId = 'u_' + Math.random().toString(36).substr(2, 6);
  
  // Create mock starting position near user for local visualization
  const latOffset = (Math.random() - 0.5) * 0.04;
  const lngOffset = (Math.random() - 0.5) * 0.04;
  const initialLat = (myLat || 37.7749) + latOffset;
  const initialLng = (myLng || -122.4194) + lngOffset;

  // Add directly to Firebase for active room synchronization
  database.ref('sessions/' + SESSION_ID + '/users/' + personId).set({
    id: personId,
    name: name,
    group: group,
    emoji: emoji,
    lat: initialLat,
    lng: initialLng,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });

  closeModal();
  showToast(`✅ Added ${name}! Share your link with them.`);
}

function selectPerson(p) {
  selectedPerson = p;
  map.flyTo([p.lat, p.lng], 15, { duration: 1 });
  
  document.getElementById('bannerName').textContent = `${p.emoji} ${p.name}`;
  document.getElementById('bannerEta').textContent = p.etaLabel || 'Calculating...';
  document.getElementById('bannerSub').textContent = `Distance: ${p.distanceLabel || 'Near'}`;
  document.getElementById('arrivalBanner').classList.add('visible');

  renderLists();
}

// ══════════════════════════════
//  ETA CALCULATIONS & DISTANCE
// ══════════════════════════════
function updateAllETAs() {
  if (!myLat || !myLng) return;

  Object.values(people).forEach(p => {
    const distKm = getHaversineDistance(myLat, myLng, p.lat, p.lng);
    const miles = distKm * 0.621371;
    
    // Assume average transit speed of 25 mph urban
    const travelTimeMins = Math.round((miles / 25) * 60);

    if (travelTimeMins < 1) {
      p.etaLabel = 'Arrived';
      p.distanceLabel = 'Here';
    } else if (travelTimeMins >= 60) {
      const hrs = Math.floor(travelTimeMins / 60);
      const mins = travelTimeMins % 60;
      p.etaLabel = `~${hrs}h ${mins}m`;
      p.distanceLabel = `${miles.toFixed(1)} miles away`;
    } else {
      p.etaLabel = `~${travelTimeMins} min`;
      p.distanceLabel = `${miles.toFixed(1)} miles away`;
    }

    if (p.marker) {
      p.marker.setIcon(createPersonIcon(p));
    }

    if (selectedPerson && selectedPerson.id === p.id) {
      document.getElementById('bannerEta').textContent = p.etaLabel;
      document.getElementById('bannerSub').textContent = `Distance: ${p.distanceLabel}`;
    }
  });

  renderLists();
}

function getHaversineDistance(lat1, lon1, lat2, lon2) {
  const R = 6371; // Radius of Earth in km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = 
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// ══════════════════════════════
//  UI RENDERERS & UTILITIES
// ══════════════════════════════
function renderLists() {
  const groups = { family: [], friends: [], business: [] };

  Object.values(people).forEach(p => {
    if (groups[p.group]) groups[p.group].push(p);
  });

  ['family', 'friends', 'business'].forEach(groupKey => {
    const container = document.getElementById(`${groupKey}-list`);
    if (!container) return;

    if (groups[groupKey].length === 0) {
      container.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);padding:8px 0;">No active trackers yet</div>`;
      return;
    }

    container.innerHTML = groups[groupKey].map(p => {
      const isSelected = selectedPerson && selectedPerson.id === p.id;
      const color = GROUP_COLORS[p.group];
      return `
        <div class="person-card ${isSelected ? 'active' : ''}" onclick="selectPerson(people['${p.id}'])">
          <div class="avatar" style="background:${color}22; border-color:${color};">${p.emoji}</div>
          <div class="person-info">
            <div class="person-name">${p.name}</div>
            <div class="person-eta">
              <span class="eta-time" style="color:${color};">${p.etaLabel || 'Updating...'}</span>
              <span>· ${p.distanceLabel || ''}</span>
            </div>
          </div>
          <div class="status-dot" style="background:${color};"></div>
        </div>
      `;
    }).join('');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
