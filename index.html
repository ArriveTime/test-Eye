<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Key Quest | Urban Treasure Hunt</title>

  <!-- Leaflet CSS & JS for Interactive Real-World Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080b12;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 215, 0, 0.25);
      --accent-gold: #ffd700;
      --accent-glow: #ffaa00;
      --accent-cyan: #00f2fe;
      --accent-purple: #7928ca;
      --text-light: #f1f5f9;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Modern Glassmorphic Header */
    header {
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 1100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 1.6rem;
      color: var(--accent-gold);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #city-title {
      font-size: 0.9rem;
      color: var(--accent-cyan);
      background: rgba(0, 242, 254, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
      position: relative;
    }

    /* Glass Side Panel */
    #sidebar {
      width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1000;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    #map {
      flex: 1;
      height: 100%;
      background: #05070a;
    }

    /* Sleek Cards */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      width: 100%;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 82, 212, 0.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 82, 212, 0.5);
      filter: brightness(1.1);
    }

    button:disabled {
      background: #2a324b !important;
      color: #64748b !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f09819 0%, #edde5d 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(240, 152, 25, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.35);
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 15, 26, 0.8);
      color: white;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    /* Stats & Bars */
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .stat-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, #11998e, #38ef7d);
      width: 100%;
      transition: width 0.4s ease;
      border-radius: 6px;
    }

    .stat-fill.low {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
    }

    /* Dice Container Animation */
    .dice-display {
      font-size: 2.2rem;
      text-align: center;
      margin: 8px 0;
      color: var(--accent-gold);
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .dice-rolling {
      animation: spin 0.4s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(0.8); }
    }

    /* Custom Scrollable Log */
    #log {
      flex: 1;
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      overflow-y: auto;
      height: 130px;
      line-height: 1.4;
    }

    .log-entry {
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .log-entry strong {
      color: var(--accent-cyan);
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #0f172a;
      padding: 24px;
      border-radius: 18px;
      max-width: 480px;
      width: 90%;
      border: 1px solid var(--accent-gold);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Map Custom Dark Styling */
    .leaflet-tile {
      filter: brightness(0.75) contrast(1.2) saturate(0.8);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <i class="fa-solid fa-key logo-icon"></i>
      <h1>CITY KEY QUEST</h1>
    </div>
    <div id="city-title"><i class="fa-solid fa-location-dot"></i> City: Select Location</div>
  </header>

  <div id="app-container">
    <div id="sidebar">

      <!-- Setup Card -->
      <div class="card" id="setup-card">
        <h3><i class="fa-solid fa-map-location-dot"></i> 1. Choose Exploration City</h3>
        <input type="text" id="city-input" placeholder="e.g. 23185 or Williamsburg" value="23185">
        <button onclick="loadCity()" style="margin-top: 8px;"><i class="fa-solid fa-magnifying-glass"></i> Load City Map</button>

        <h3 style="margin-top:16px;"><i class="fa-solid fa-user-gear"></i> 2. Player & Audio Settings</h3>
        <input type="text" id="player-name" placeholder="Player Name" value="Explorer1">
        
        <label style="margin-top: 8px; display: block; font-size: 0.85rem; color: #94a3b8;">Guide Voice:</label>
        <select id="voice-gender-select">
          <option value="female">🎙️ Female Audio Guide</option>
          <option value="male">🎙️ Male Audio Guide</option>
        </select>

        <label style="margin-top: 8px; display: block; font-size: 0.85rem; color: #94a3b8;">Transport Vehicle:</label>
        <select id="transport-select">
          <option value="walk">🚶 Walking (+0 bonus speed)</option>
          <option value="bike">🚲 Bicycle (+1 bonus speed)</option>
          <option value="car">🚗 Sports Car (+2 bonus speed)</option>
        </select>
        
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" id="dog-checkbox" style="width: auto; margin:0;"> Bring Pet Dog 🐕 (Requires hydration stops)
        </label>
        
        <button class="btn-gold" onclick="startGame()" style="margin-top: 14px;"><i class="fa-solid fa-play"></i> Start Quest</button>
      </div>

      <!-- Gameplay Controls -->
      <div class="card" id="game-controls" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 id="current-player-turn" style="margin:0;"><i class="fa-solid fa-gamepad"></i> Turn Controls</h3>
          <span id="moves-left-tag" style="color: var(--accent-gold); font-weight: 800; font-family: 'Orbitron'; font-size: 1.1rem;">Moves: 0</span>
        </div>

        <div class="dice-display" id="dice-container"><i class="fa-solid fa-dice-d6"></i></div>

        <button id="roll-btn" class="btn-gold" onclick="rollDice()"><i class="fa-solid fa-dice"></i> Roll 1 Die</button>
        <button id="alley-btn" class="btn-danger" onclick="takeDarkAlleyShortcut()" style="margin-top: 8px;" disabled><i class="fa-solid fa-mask"></i> Dark Alley Shortcut</button>
      </div>

      <!-- Stats -->
      <div class="card" id="stats-card" style="display: none;">
        <h3><i class="fa-solid fa-chart-simple"></i> Status & Vitals</h3>
        <div class="stat-row">
          <span><i class="fa-solid fa-star" style="color:var(--accent-gold);"></i> Points: <strong id="score-val">0</strong></span>
          <span><i class="fa-solid fa-coins" style="color:var(--accent-cyan);"></i> Tokens: <strong id="token-val">50</strong></span>
        </div>
        <div style="margin-top: 8px;">
          <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
            <span><i class="fa-solid fa-heart-pulse" style="color:var(--danger);"></i> Health Stamina</span>
            <span id="health-num">100%</span>
          </div>
          <div class="stat-bar"><div id="health-bar" class="stat-fill"></div></div>
        </div>
        <div id="dog-stat-container" style="margin-top: 8px; display: none;">
          <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
            <span><i class="fa-solid fa-dog" style="color:#00f2fe;"></i> Dog Hydration</span>
            <span id="dog-num">100%</span>
          </div>
          <div class="stat-bar"><div id="dog-bar" class="stat-fill" style="background: linear-gradient(90deg, #00c6ff, #0072ff);"></div></div>
        </div>
      </div>

      <!-- Activity Log & Voice Test -->
      <div class="card" style="display: flex; flex-direction: column; flex: 1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h3 style="margin: 0;"><i class="fa-solid fa-scroll"></i> Quest Log</h3>
          <button onclick="testVoice()" style="width: auto; padding: 4px 10px; font-size: 0.75rem;"><i class="fa-solid fa-volume-high"></i> Test Voice</button>
        </div>
        <div id="log"></div>
      </div>

    </div>

    <!-- Interactive Leaflet Map -->
    <div id="map"></div>
  </div>

  <!-- Location Interaction Modal -->
  <div class="modal" id="encounter-modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <h2 id="modal-title" style="margin:0; color:var(--accent-gold); font-family:'Orbitron';">Location</h2>
        <span id="modal-type" style="font-size:0.75rem; background:rgba(255,215,0,0.15); color:var(--accent-gold); padding:4px 8px; border-radius:12px; border:1px solid var(--accent-gold);">SPOT</span>
      </div>
      <p id="modal-description" style="color:#cbd5e1; font-size:0.95rem; margin:16px 0 20px 0;">You stand outside the door. What would you like to do?</p>
      <div id="modal-actions" style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-gold" onclick="openDoor()"><i class="fa-solid fa-door-open"></i> Open Door & Search for Golden Key</button>
        <button onclick="visitRestroomOrEat()"><i class="fa-solid fa-utensils"></i> Spend 10 Tokens to Rest & Eat</button>
        <button id="dog-water-btn" onclick="hydrateDog()" style="display:none; background: linear-gradient(135deg, #00c6ff, #0072ff);"><i class="fa-solid fa-glass-water"></i> Give Dog Fresh Water (Pet Friendly)</button>
        <button onclick="studyAtSchool()"><i class="fa-solid fa-graduation-cap"></i> Study Clues (Skip 1 Turn)</button>
        <button onclick="closeModal()" style="background:#334155;"><i class="fa-solid fa-xmark"></i> Leave Location</button>
      </div>
    </div>
  </div>

  <script>
    let map, userMarker;
    let locations = [];
    let gameActive = false;
    let movesRemaining = 0;
    let availableVoices = [];

    // Clue Pool (Text & Riddle Based)
    const wordRiddles = [
      "Look where hot coffee brews and fresh pastries are baked.",
      "The Golden Key rests where history or fine artwork is displayed.",
      "Search near a bustling place where food and refreshing drinks are served.",
      "The key resides where people gather to gain knowledge and study.",
      "Seek out a lively spot filled with outdoor green space and trees.",
      "Look behind the door of a business where music or dancing fills the room."
    ];

    let player = {
      name: "Explorer1",
      lat: 0,
      lng: 0,
      points: 0,
      tokens: 50,
      health: 100,
      dogHydration: 100,
      hasDog: false,
      transport: "walk",
      voiceGender: "female",
      inJailTurns: 0,
      isStudyingTurns: 0
    };

    let goldenKeyLocation = null;

    // Load Speech Synthesis Engine
    function initVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          availableVoices = window.speechSynthesis.getVoices();
        };
      }
    }
    initVoices();

    // Natural Speech Synthesis Audio Engine
    function speak(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Stop overlap

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95; // Natural human speech cadence
      utterance.pitch = player.voiceGender === 'female' ? 1.1 : 0.9;

      if (availableVoices.length > 0) {
        // Prioritize natural sounding system voices
        const selectedVoice = availableVoices.find(voice => {
          const vName = voice.name.toLowerCase();
          const isNatural = vName.includes('natural') || vName.includes('google') || vName.includes('premium') || vName.includes('siri');
          if (player.voiceGender === 'female') {
            return (vName.includes('female') || vName.includes('zira') || vName.includes('samantha') || vName.includes('victoria') || vName.includes('karen')) && (isNatural || true);
          } else {
            return (vName.includes('male') || vName.includes('david') || vName.includes('alex') || vName.includes('george') || vName.includes('daniel')) && (isNatural || true);
          }
        });

        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }
      }

      window.speechSynthesis.speak(utterance);
    }

    function testVoice() {
      player.voiceGender = document.getElementById('voice-gender-select').value;
      speak(`Hello! I am your ${player.voiceGender} narrator. I will guide you on your quest to find the Golden Key!`);
    }

    // Initialize Map with Custom Dark CartoDB Tiles
    function initMap(lat = 37.2707, lng = -76.7075) {
      if (map) map.remove();
      map = L.map('map', { zoomControl: false }).setView([lat, lng], 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap © CARTO'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    window.onload = () => {
      initMap();
      log("Welcome to City Key Quest. Enter a city or ZIP code to render your map.", false);
    };

    function log(msg, autoSpeak = true) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `> ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;

      if(autoSpeak && gameActive) {
        // Clean HTML tags for voice synthesis output
        const cleanText = msg.replace(/<\/?[^>]+(>|$)/g, "");
        speak(cleanText);
      }
    }

    // Load City via Nominatim OpenStreetMap API
    async function loadCity() {
      const query = document.getElementById('city-input').value;
      if(!query) return alert("Please enter a city or ZIP code");

      log(`Searching location database for ${query}...`, false);
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          player.lat = lat;
          player.lng = lon;

          initMap(lat, lon);
          document.getElementById('city-title').innerHTML = `<i class="fa-solid fa-location-dot"></i> City: ${data[0].display_name.split(',')[0]}`;
          
          // Home Marker
          const homeIcon = L.divIcon({
            html: '<i class="fa-solid fa-house-chimney" style="color:#00f2fe; font-size: 24px; filter: drop-shadow(0 0 6px #00f2fe);"></i>',
            className: 'custom-map-pin'
          });
          userMarker = L.marker([lat, lon], {icon: homeIcon}).addTo(map).bindPopup("<b>Home Base</b>").openPopup();
          
          fetchNearbyBusinesses(lat, lon);
          log("Map terrain loaded successfully.", false);
        } else {
          alert("City/ZIP location not found.");
        }
      } catch (err) {
        log("Error retrieving city mapping.", false);
      }
    }

    // Retrieve Real Places via Overpass API
    async function fetchNearbyBusinesses(lat, lng) {
      const query = `
        [out:json];
        (
          node["amenity"](around:2200, ${lat}, ${lng});
          node["tourism"](around:2200, ${lat}, ${lng});
        );
        out body 15;
      `;
      const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

      try {
        const res = await fetch(url);
        const data = await res.json();
        locations = [];

        if(data.elements && data.elements.length > 0) {
          data.elements.forEach((el, index) => {
            if(el.tags && el.tags.name) {
              const isPetFriendly = index % 2 === 0;
              const riddleClue = wordRiddles[index % wordRiddles.length];
              locations.push({
                id: index,
                name: el.tags.name,
                type: el.tags.amenity || el.tags.tourism || "Local Business",
                lat: el.lat,
                lng: el.lon,
                petFriendly: isPetFriendly,
                clue: riddleClue
              });
            }
          });
        }

        // Fallback Spots
        if (locations.length < 5) {
          locations = [
            { id: 1, name: "City Art Museum", type: "museum", lat: lat + 0.003, lng: lng + 0.002, petFriendly: true, clue: wordRiddles[1] },
            { id: 2, name: "Grand Central Bistro", type: "restaurant", lat: lat - 0.002, lng: lng + 0.004, petFriendly: false, clue: wordRiddles[2] },
            { id: 3, name: "Heritage Library", type: "school", lat: lat + 0.005, lng: lng - 0.003, petFriendly: true, clue: wordRiddles[3] },
            { id: 4, name: "Metro Cafe & Bakery", type: "cafe", lat: lat - 0.004, lng: lng - 0.002, petFriendly: false, clue: wordRiddles[0] }
          ];
        }

        const keyIndex = Math.floor(Math.random() * locations.length);
        goldenKeyLocation = locations[keyIndex].id;

        // Render Custom Map Pin Graphics
        locations.forEach(loc => {
          const pinIcon = L.divIcon({
            html: `<i class="fa-solid ${loc.petFriendly ? 'fa-paw' : 'fa-building-shield'}" style="color:${loc.petFriendly ? '#2ed573' : '#ffd700'}; font-size:20px; filter: drop-shadow(0 0 8px rgba(0,0,0,0.8));"></i>`,
            className: 'custom-business-pin'
          });

          const marker = L.marker([loc.lat, loc.lng], {icon: pinIcon}).addTo(map);
          marker.bindPopup(`
            <div style="color:#000; font-family:'Outfit',sans-serif;">
              <strong>${loc.name}</strong><br>
              <small>Type: ${loc.type}</small><br>
              <button onclick="interactWithLocation(${loc.id})" style="margin-top:6px; padding:6px; font-size:0.75rem;">Enter Location</button>
            </div>
          `);
        });

      } catch (err) {
        log("City businesses indexed for questing.", false);
      }
    }

    function startGame() {
      if(!player.lat) return alert("Please load a city map location first!");

      player.name = document.getElementById('player-name').value || "Explorer1";
      player.transport = document.getElementById('transport-select').value;
      player.hasDog = document.getElementById('dog-checkbox').checked;
      player.voiceGender = document.getElementById('voice-gender-select').value;

      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('game-controls').style.display = 'block';
      document.getElementById('stats-card').style.display = 'block';

      if(player.hasDog) {
        document.getElementById('dog-stat-container').style.display = 'block';
      }

      gameActive = true;
      updateUI();
      log(`Greetings <strong>${player.name}</strong>! I am your guide. Roll the die to begin exploring your city!`);
    }

    function rollDice() {
      if(!gameActive) return;

      if(player.inJailTurns > 0) {
        player.inJailTurns--;
        log(`🚔 You are in Jail! Turn skipped. Turns remaining: ${player.inJailTurns}`);
        return;
      }

      if(player.isStudyingTurns > 0) {
        player.isStudyingTurns--;
        log(`📚 You are currently studying at school to unlock key clues! Turn skipped.`);
        return;
      }

      // Dice Animation
      const diceDisplay = document.getElementById('dice-container');
      diceDisplay.classList.add('dice-rolling');

      setTimeout(() => {
        diceDisplay.classList.remove('dice-rolling');
        const roll = Math.floor(Math.random() * 6) + 1;
        let bonus = player.transport === 'car' ? 2 : player.transport === 'bike' ? 1 : 0;
        movesRemaining = roll + bonus;

        const diceIcons = ['fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];
        diceDisplay.innerHTML = `<i class="fa-solid ${diceIcons[roll-1]}"></i>`;

        log(`🎲 You rolled a <strong>${roll}</strong>! (+${bonus} vehicle bonus). Total moves: ${movesRemaining}`);
        
        document.getElementById('roll-btn').disabled = true;
        document.getElementById('alley-btn').disabled = false;
        document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;

        drainLife(6);
      }, 400);
    }

    function drainLife(amount) {
      player.health = Math.max(0, player.health - amount);
      if(player.hasDog) {
        player.dogHydration = Math.max(0, player.dogHydration - (amount * 1.4));
      }

      if(player.health <= 25 && player.health > 0) {
        speak("Warning: Your stamina is getting low! Stop at a local business to rest and eat.");
      }

      if(player.health <= 0) {
        log(`💀 You collapsed from fatigue! Returning home to recover stamina.`);
        resetToHome();
      }

      if(player.hasDog && player.dogHydration <= 0) {
        log(`🐕 Your dog is too dehydrated to continue! Returning to home base.`);
        resetToHome();
      }

      updateUI();
    }

    function resetToHome() {
      player.health = 100;
      player.dogHydration = 100;
      userMarker.setLatLng([player.lat, player.lng]);
      map.panTo([player.lat, player.lng]);
      movesRemaining = 0;
      document.getElementById('roll-btn').disabled = false;
      document.getElementById('alley-btn').disabled = true;
      updateUI();
    }

    let activeEncounterLoc = null;

    window.interactWithLocation = function(locId) {
      if(movesRemaining <= 0) {
        speak("You need remaining moves from a dice roll to reach this location.");
        return alert("You need remaining moves from a dice roll to enter this business!");
      }

      const loc = locations.find(l => l.id === locId);
      if(!loc) return;

      activeEncounterLoc = loc;

      if(player.hasDog && !loc.petFriendly) {
        log(`🚫 <strong>${loc.name}</strong> is not pet-friendly! Your dog cannot enter.`);
        return;
      }

      userMarker.setLatLng([loc.lat, loc.lng]);
      movesRemaining--;
      player.points += 15;
      player.tokens += 10;

      document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;
      if(movesRemaining === 0) {
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('alley-btn').disabled = true;
      }

      document.getElementById('modal-title').innerText = loc.name;
      document.getElementById('modal-type').innerText = loc.petFriendly ? '🐾 PET FRIENDLY' : 'NO PETS';
      document.getElementById('dog-water-btn').style.display = player.hasDog ? 'block' : 'none';
      document.getElementById('encounter-modal').style.display = 'flex';

      speak(`You stand outside ${loc.name}. Would you like to open the door and search inside, or rest and replenish?`);
      updateUI();
    };

    function openDoor() {
      if(!activeEncounterLoc) return;

      if(activeEncounterLoc.id === goldenKeyLocation) {
        log(`🎉 <strong>CONGRATULATIONS!</strong> You opened the door at <strong>${activeEncounterLoc.name}</strong> and found the GOLDEN KEY! YOU WIN!`);
        player.points += 500;
        gameActive = false;
      } else {
        log(`🔑 No Golden Key here! Behind the door you find a clue: <em>"${activeEncounterLoc.clue}"</em>`);
      }
      closeModal();
    }

    function visitRestroomOrEat() {
      if(player.tokens < 10) {
        speak("You do not have enough tokens to buy food.");
        return alert("Not enough tokens!");
      }
      player.tokens -= 10;
      player.health = Math.min(100, player.health + 45);
      log(`🍕 Stopped to rest and eat. Stamina restored to ${player.health} percent.`);
      updateUI();
      closeModal();
    }

    function hydrateDog() {
      player.dogHydration = 100;
      log(`🐕 Gave your dog fresh water! Dog hydration restored to 100 percent.`);
      updateUI();
      closeModal();
    }

    function studyAtSchool() {
      player.isStudyingTurns = 1;
      log(`📚 Enrolled to study local clues. Next roll skipped.`);
      closeModal();
    }

    function takeDarkAlleyShortcut() {
      if(movesRemaining <= 0) return;

      const risk = Math.random();

      if(risk < 0.45) {
        log(`🕶️ You were ambushed in a dark alley! You lost 20 tokens and were sent back home.`);
        player.tokens = Math.max(0, player.tokens - 20);
        resetToHome();
      } else {
        log(`⚡ Dark alley shortcut successful! You gained 2 additional moves.`);
        movesRemaining += 2;
        document.getElementById('moves-left-tag').innerText = `Moves: ${movesRemaining}`;
      }
    }

    function closeModal() {
      document.getElementById('encounter-modal').style.display = 'none';
    }

    function updateUI() {
      document.getElementById('score-val').innerText = player.points;
      document.getElementById('token-val').innerText = player.tokens;
      
      const hBar = document.getElementById('health-bar');
      hBar.style.width = player.health + '%';
      document.getElementById('health-num').innerText = player.health + '%';
      if(player.health < 30) hBar.classList.add('low');
      else hBar.classList.remove('low');

      if(player.hasDog) {
        document.getElementById('dog-bar').style.width = player.dogHydration + '%';
        document.getElementById('dog-num').innerText = Math.round(player.dogHydration) + '%';
      }
    }
  </script>
</body>
</html>
