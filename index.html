<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CITY KEY QUEST // NEXUS</title>


<!-- =========================================================
     FREE MAP SYSTEM
     Leaflet = free/open-source map interface
     OpenStreetMap = map data
     No Google / Mapbox / MapTiler API key required
========================================================= -->

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =========================================================
     FONTS
========================================================= -->

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
      rel="stylesheet">


<!-- =========================================================
     ICONS
========================================================= -->

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

/* =========================================================
   GLOBAL DESIGN
========================================================= */

:root {

    --bg:
        #02050b;

    --panel:
        rgba(5, 12, 24, .90);

    --panel2:
        rgba(8, 18, 34, .95);

    --cyan:
        #00f6ff;

    --blue:
        #168cff;

    --gold:
        #ffd400;

    --green:
        #20ff91;

    --red:
        #ff3159;

    --purple:
        #a855ff;

    --orange:
        #ff8a00;

    --text:
        #eef7ff;

    --muted:
        #7e95ad;

    --border:
        rgba(0,246,255,.20);

    --shadow:
        0 0 35px rgba(0,246,255,.12);
}


* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    user-select:
        none;
}


html,
body {

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;
}


body {

    font-family:
        'Outfit',
        sans-serif;

    color:
        var(--text);

    background:
        radial-gradient(
            circle at 50% 50%,
            #07162b 0%,
            #02050b 65%
        );
}


button,
input,
select {

    font-family:
        inherit;
}


button {

    cursor:
        pointer;
}


/* =========================================================
   MAIN GAME WINDOW
========================================================= */

#game-window {

    position:
        relative;

    width:
        100vw;

    height:
        100vh;

    overflow:
        hidden;

    background:
        #02050b;
}


/* =========================================================
   MAP
========================================================= */

#map {

    position:
        absolute;

    inset:
        0;

    z-index:
        1;

    background:
        #02050a;
}


/*
   Futuristic visual treatment for the
   OpenStreetMap tiles.
*/

.leaflet-tile {

    filter:
        brightness(.48)
        contrast(1.25)
        saturate(.65)
        hue-rotate(175deg);
}


/*
   OpenStreetMap attribution.
   This should remain visible because
   OpenStreetMap requires attribution.
*/

.leaflet-control-attribution {

    background:
        rgba(2,8,18,.88) !important;

    color:
        #7e95ad !important;

    font-size:
        9px !important;
}


.leaflet-control-attribution a {

    color:
        var(--cyan) !important;
}


/* =========================================================
   TOP HEADER
========================================================= */

.top-header {

    position:
        absolute;

    top:
        16px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        1000;

    display:
        flex;

    align-items:
        center;

    gap:
        13px;

    padding:
        11px 30px;

    border:
        1px solid rgba(0,246,255,.32);

    border-radius:
        50px;

    background:
        rgba(3,10,20,.90);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 0 30px rgba(0,246,255,.12),
        inset 0 0 20px rgba(0,246,255,.03);

    white-space:
        nowrap;
}


.header-key {

    color:
        var(--gold);

    font-size:
        1.6rem;

    filter:
        drop-shadow(0 0 8px var(--gold));
}


.header-title {

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        1.25rem;

    font-weight:
        900;

    letter-spacing:
        4px;

    background:
        linear-gradient(
            90deg,
            white,
            var(--cyan),
            var(--gold)
        );

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;
}


.header-status {

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .58rem;

    color:
        var(--green);

    letter-spacing:
        1px;
}


/* =========================================================
   STATUS CHIP
========================================================= */

.status-chip {

    position:
        absolute;

    top:
        78px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        1000;

    padding:
        6px 13px;

    border-radius:
        20px;

    background:
        rgba(3,10,20,.90);

    border:
        1px solid var(--green);

    color:
        var(--green);

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .56rem;

    letter-spacing:
        1px;

    box-shadow:
        0 0 12px rgba(32,255,145,.12);
}


/* =========================================================
   GENERIC PANEL
========================================================= */

.ui-panel {

    position:
        absolute;

    z-index:
        1000;

    background:
        linear-gradient(
            145deg,
            rgba(8,20,37,.94),
            rgba(2,8,18,.92)
        );

    border:
        1px solid var(--border);

    backdrop-filter:
        blur(18px);

    border-radius:
        15px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 0 25px rgba(0,246,255,.025);
}


.panel-title {

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .67rem;

    font-weight:
        800;

    letter-spacing:
        1.8px;

    color:
        #c9e9ff;

    text-transform:
        uppercase;

    margin-bottom:
        10px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;
}


/* =========================================================
   LEFT SIDEBAR
========================================================= */

#left-sidebar {

    top:
        18px;

    left:
        18px;

    bottom:
        18px;

    width:
        325px;

    padding:
        15px;

    overflow-y:
        auto;

    display:
        flex;

    flex-direction:
        column;

    gap:
        13px;
}


#left-sidebar::-webkit-scrollbar {

    width:
        4px;
}


#left-sidebar::-webkit-scrollbar-thumb {

    background:
        var(--cyan);

    border-radius:
        10px;
}


/* =========================================================
   POINTS CORE
========================================================= */

.points-core {

    padding:
        15px;

    border-radius:
        12px;

    border:
        1px solid rgba(255,212,0,.28);

    background:
        radial-gradient(
            circle at top right,
            rgba(255,212,0,.13),
            transparent 55%
        );

    box-shadow:
        inset 0 0 25px rgba(255,212,0,.025);
}


.points-label {

    color:
        var(--muted);

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .58rem;

    letter-spacing:
        2px;
}


.points-number {

    margin-top:
        3px;

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        2rem;

    font-weight:
        900;

    color:
        var(--gold);

    text-shadow:
        0 0 15px rgba(255,212,0,.55);

    transition:
        transform .15s;
}


.points-number.pulse {

    transform:
        scale(1.08);
}


.points-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        7px;

    margin-top:
        10px;
}


.mini-stat {

    padding:
        8px;

    border-radius:
        8px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.06);
}


.mini-label {

    color:
        var(--muted);

    font-size:
        .57rem;

    text-transform:
        uppercase;
}


.mini-value {

    margin-top:
        2px;

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .9rem;

    color:
        white;
}


/* =========================================================
   CAREER
========================================================= */

.career-badge {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    padding:
        10px;

    border-radius:
        10px;

    background:
        rgba(0,246,255,.05);

    border:
        1px solid rgba(0,246,255,.12);
}


.career-icon {

    width:
        35px;

    height:
        35px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    border-radius:
        9px;

    background:
        rgba(0,246,255,.10);

    color:
        var(--cyan);

    box-shadow:
        0 0 15px rgba(0,246,255,.12);
}


.career-name {

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .72rem;

    font-weight:
        800;
}


.career-status {

    color:
        var(--muted);

    font-size:
        .65rem;
}


/* =========================================================
   GENDER
========================================================= */

.gender-toggle {

    display:
        flex;

    gap:
        7px;
}


.gender-btn {

    flex:
        1;

    padding:
        8px;

    color:
        var(--muted);

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:
        8px;

    transition:
        .2s;
}


.gender-btn.active {

    color:
        var(--cyan);

    border-color:
        var(--cyan);

    background:
        rgba(0,246,255,.09);

    box-shadow:
        0 0 14px rgba(0,246,255,.14);
}


/* =========================================================
   INPUTS
========================================================= */

.input-group {

    display:
        flex;

    align-items:
        center;

    gap:
        7px;

    margin-bottom:
        7px;
}


.input-label {

    width:
        65px;

    color:
        var(--muted);

    font-size:
        .68rem;
}


input,
select {

    flex:
        1;

    min-width:
        0;

    color:
        white;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:
        6px;

    padding:
        7px 8px;

    outline:
        none;
}


input:focus,
select:focus {

    border-color:
        var(--cyan);

    box-shadow:
        0 0 10px rgba(0,246,255,.08);
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.btn-main {

    width:
        100%;

    padding:
        10px;

    border:
        0;

    border-radius:
        8px;

    color:
        #001018;

    font-family:
        Orbitron,
        sans-serif;

    font-weight:
        900;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            #74ffff
        );

    box-shadow:
        0 0 18px rgba(0,246,255,.20);

    transition:
        .2s;
}


.btn-main:hover {

    filter:
        brightness(1.15);

    transform:
        translateY(-1px);
}


/* =========================================================
   LIVE BARS
========================================================= */

.stat-bar {

    margin-bottom:
        8px;
}


.stat-row {

    display:
        flex;

    justify-content:
        space-between;

    color:
        var(--muted);

    font-size:
        .68rem;

    margin-bottom:
        4px;
}


.bar-bg {

    height:
        7px;

    overflow:
        hidden;

    border-radius:
        20px;

    background:
        rgba(255,255,255,.06);
}


.bar-fill {

    height:
        100%;

    width:
        100%;

    border-radius:
        inherit;

    transition:
        width .3s;
}


/* =========================================================
   ACTIVITY LOG
========================================================= */

#log-box {

    max-height:
        150px;

    overflow-y:
        auto;

    color:
        #b8cadb;

    font-size:
        .68rem;

    line-height:
        1.45;
}


.log-line {

    padding:
        6px 0;

    border-bottom:
        1px solid rgba(255,255,255,.04);
}


/* =========================================================
   RIGHT ACTION MENU
========================================================= */

#action-menu {

    top:
        105px;

    right:
        18px;

    width:
        235px;

    padding:
        12px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        7px;
}


.action-btn {

    width:
        100%;

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    padding:
        10px;

    border-radius:
        9px;

    color:
        var(--text);

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    font-size:
        .72rem;

    transition:
        .2s;
}


.action-btn:hover {

    border-color:
        var(--cyan);

    background:
        rgba(0,246,255,.08);

    transform:
        translateX(-2px);
}


/* =========================================================
   BOTTOM HUD
========================================================= */

#bottom-hud {

    position:
        absolute;

    z-index:
        1000;

    bottom:
        18px;

    left:
        50%;

    transform:
        translateX(-50%);

    display:
        flex;

    align-items:
        center;

    gap:
        15px;
}


.roll-orb {

    width:
        76px;

    height:
        76px;

    border-radius:
        50%;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    color:
        var(--gold);

    font-size:
        1.7rem;

    background:
        radial-gradient(
            circle,
            rgba(255,212,0,.18),
            rgba(3,10,20,.96) 70%
        );

    border:
        2px solid var(--gold);

    box-shadow:
        0 0 30px rgba(255,212,0,.28);

    transition:
        .2s;
}


.roll-orb:hover {

    transform:
        scale(1.06);

    box-shadow:
        0 0 45px rgba(255,212,0,.45);
}


.moves-tag {

    padding:
        12px 18px;

    border-radius:
        10px;

    background:
        rgba(3,10,20,.90);

    border:
        1px solid var(--cyan);

    font-family:
        Orbitron,
        sans-serif;

    font-size:
        .75rem;
}


.moves-tag strong {

    color:
        var(--cyan);

    font-size:
        1rem;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        3000;

    display:
        none;

    justify-content:
        center;

    align-items:
        center;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(12px);
}


.modal-card {

    width:
        min(94vw, 470px);

    max-height:
        85vh;

    overflow-y:
        auto;

    padding:
        22px;

    border-radius:
        16px;

    background:
        linear-gradient(
            145deg,
            #081426,
            #030812
        );

    border:
        1px solid var(--cyan);

    box-shadow:
        0 0 50px rgba(0,246,255,.16);
}


.modal-title {

    font-family:
        Orbitron,
        sans-serif;

    color:
        var(--cyan);

    margin-bottom:
        10px;
}


.modal-text {

    color:
        #a9bdd0;

    font-size:
        .78rem;

    line-height:
        1.5;

    margin-bottom:
        15px;
}


.modal-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        8px;
}


.option-btn {

    padding:
        11px;

    border-radius:
        9px;

    color:
        white;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.10);

    transition:
        .2s;
}


.option-btn:hover {

    border-color:
        var(--cyan);

    background:
        rgba(0,246,255,.08);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px) {

    #left-sidebar {

        width:
            260px;

    }

    #action-menu {

        width:
            190px;

    }

    .header-title {

        font-size:
            .9rem;

        letter-spacing:
            2px;

    }

    .header-status {

        display:
            none;

    }

}


@media(max-width:600px) {

    #left-sidebar {

        width:
            230px;

        left:
            8px;

        top:
            8px;

        bottom:
            8px;

    }

    #action-menu {

        right:
            8px;

        top:
            90px;

        width:
            170px;

    }

    .top-header {

        padding:
            9px 15px;

    }

    .header-title {

        font-size:
            .72rem;

    }

    .status-chip {

        display:
            none;

    }

}

</style>

</head>


<body>


<div id="game-window">


<!-- =========================================================
     HEADER
========================================================= -->

<div class="top-header">

    <i class="fa-solid fa-key header-key"></i>

    <span class="header-title">
        CITY KEY QUEST
    </span>

    <span class="header-status">
        // NEXUS
    </span>

</div>


<!-- =========================================================
     STATUS
========================================================= -->

<div
    class="status-chip"
    id="protection-status">

    ● OPEN WORLD

</div>


<!-- =========================================================
     MAP
========================================================= -->

<div id="map"></div>


<!-- =========================================================
     LEFT SIDEBAR
========================================================= -->

<div
    class="ui-panel"
    id="left-sidebar">


    <!-- LIVE POINTS -->

    <div class="points-core">

        <div class="points-label">
            LIVE QUEST POINTS
        </div>

        <div
            class="points-number"
            id="points-display">

            0

        </div>


        <div class="points-grid">

            <div class="mini-stat">

                <div class="mini-label">
                    Reserve
                </div>

                <div
                    class="mini-value"
                    id="reserve-display">

                    50

                </div>

            </div>


            <div class="mini-stat">

                <div class="mini-label">
                    Clues
                </div>

                <div
                    class="mini-value"
                    id="clue-display">

                    0

                </div>

            </div>


            <div class="mini-stat">

                <div class="mini-label">
                    Time
                </div>

                <div
                    class="mini-value"
                    id="time-display">

                    00:00

                </div>

            </div>


            <div class="mini-stat">

                <div class="mini-label">
                    Reports
                </div>

                <div
                    class="mini-value"
                    id="crime-display">

                    0

                </div>

            </div>

        </div>

    </div>


    <!-- CAREER -->

    <div>

        <div class="panel-title">

            <span>
                CAREER STATUS
            </span>

            <i
                class="fa-solid fa-id-card"
                style="color:var(--cyan)">
            </i>

        </div>


        <div class="career-badge">

            <div class="career-icon">

                <i
                    id="career-icon"
                    class="fa-solid fa-user">
                </i>

            </div>


            <div>

                <div
                    class="career-name"
                    id="career-name">

                    CIVILIAN

                </div>


                <div
                    class="career-status"
                    id="career-status">

                    Open World Player

                </div>

            </div>

        </div>

    </div>


    <!-- PLAYER PROFILE -->

    <div style="
        border-top:1px solid rgba(255,255,255,.07);
        padding-top:10px;
    ">

        <div class="panel-title">

            PLAYER PROFILE

        </div>


        <div class="gender-toggle">

            <button
                class="gender-btn active"
                id="btn-female"
                onclick="setGender('female')">

                <i class="fa-solid fa-venus"></i>

                FEMALE

            </button>


            <button
                class="gender-btn"
                id="btn-male"
                onclick="setGender('male')">

                <i class="fa-solid fa-mars"></i>

                MALE

            </button>

        </div>


        <br>


        <div class="input-group">

            <span class="input-label">
                Name
            </span>

            <input
                id="player-name-input"
                value="Explorer1"
                maxlength="20">

        </div>


        <div class="input-group">

            <span class="input-label">
                ZIP
            </span>

            <input
                id="zip-input"
                value="23185"
                maxlength="5"
                inputmode="numeric"
                placeholder="ZIP Code">

        </div>


        <div class="input-group">

            <span class="input-label">
                Transport
            </span>

            <select id="transport-input">

                <option value="walk">
                    🚶 Walking
                </option>

                <option value="bike">
                    🚲 Bike (+1)
                </option>

                <option value="car">
                    🚗 Car (+2)
                </option>

            </select>

        </div>


        <button
            class="btn-main"
            onclick="initGame()">

            INITIALIZE QUEST

        </button>

    </div>


    <!-- PLAYER SYSTEMS -->

    <div style="
        border-top:1px solid rgba(255,255,255,.07);
        padding-top:10px;
    ">

        <div class="panel-title">

            PLAYER SYSTEMS

        </div>


        <!-- LIFE -->

        <div class="stat-bar">

            <div class="stat-row">

                <span>
                    LIFE
                </span>

                <span id="life-text">
                    100
                </span>

            </div>


            <div class="bar-bg">

                <div
                    class="bar-fill"
                    id="life-bar"
                    style="
                        width:100%;
                        background:var(--red);
                    ">
                </div>

            </div>

        </div>


        <!-- RESERVE -->

        <div class="stat-bar">

            <div class="stat-row">

                <span>
                    RESERVE
                </span>

                <span id="reserve-text">
                    50
                </span>

            </div>


            <div class="bar-bg">

                <div
                    class="bar-fill"
                    id="reserve-bar"
                    style="

/* =========================================================
   FREE OPENSTREETMAP INITIALIZATION
========================================================= */

function initMap(lat, lng) {


    /*
       Remove previous map.
    */

    if (map) {

        map.remove();

        map =
            null;

    }


    /*
       Create Leaflet map.
    */

    map =
        L.map(
            'map',
            {
                zoomControl:
                    false,

                attributionControl:
                    true
            }
        )
        .setView(
            [lat, lng],
            15
        );


    /*
       FREE OPENSTREETMAP TILE SERVER

       No API key required.
    */

    L.tileLayer(

        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

        {

            maxZoom:
                19,

            minZoom:
                3,

            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'

        }

    ).addTo(map);


    /*
       Futuristic player marker.
    */

    const playerIcon =
        L.divIcon({

            html: `

                <div style="
                    width:42px;
                    height:42px;

                    display:flex;

                    align-items:center;
                    justify-content:center;

                    border-radius:50%;

                    background:
                        rgba(0,246,255,.10);

                    border:
                        1px solid #00f6ff;

                    box-shadow:
                        0 0 12px #00f6ff,
                        0 0 30px rgba(0,246,255,.45);
                ">

                    <i
                        class="fa-solid fa-location-crosshairs"
                        style="
                            color:#00f6ff;
                            font-size:22px;

                            filter:
                                drop-shadow(
                                    0 0 6px #00f6ff
                                );
                        ">
                    </i>

                </div>

            `,

            className:
                'custom-player-marker',

            iconSize:
                [42,42],

            iconAnchor:
                [21,21]

        });


    /*
       Add player marker.
    */

    userMarker =
        L.marker(

            [lat,lng],

            {
                icon:
                    playerIcon
            }

        )
        .addTo(map);


    /*
       Add futuristic player
       radar/area circle.
    */

    L.circle(

        [lat,lng],

        {

            radius:
                75,

            color:
                '#00f6ff',

            weight:
                1,

            opacity:
                .35,

            fillColor:
                '#00f6ff',

            fillOpacity:
                .04

        }

    ).addTo(map);

}


/* =========================================================
   FREE ZIP CODE LOCATION LOOKUP
========================================================= */

async function getCoordinatesFromZip(zip) {


    /*
       Clean ZIP input.
    */

    const cleanZip =
        String(zip)
            .trim()
            .replace(
                /\s+/g,
                ''
            );


    /*
       U.S. ZIP validation.
    */

    if (
        !/^\d{5}$/.test(cleanZip)
    ) {

        throw new Error(
            'Please enter a valid 5-digit U.S. ZIP code.'
        );

    }


    /*
       Zippopotam.us
       does not require an API key.
    */

    const response =
        await fetch(

            `https://api.zippopotam.us/us/${cleanZip}`

        );


    if (
        !response.ok
    ) {

        throw new Error(
            'ZIP code could not be located.'
        );

    }


    const data =
        await response.json();


    if (
        !data.places ||
        !data.places.length
    ) {

        throw new Error(
            'No location found for that ZIP code.'
        );

    }


    const place =
        data.places[0];


    return {

        lat:
            parseFloat(
                place.latitude
            ),

        lng:
            parseFloat(
                place.longitude
            ),

        city:
            place['place name'],

        state:
            place['state abbreviation'],

        stateName:
            place.state

    };

}


/* =========================================================
   ACTIVITY LOG
========================================================= */

function addLog(text) {


    const box =
        document.getElementById(
            'log-box'
        );


    const line =
        document.createElement(
            'div'
        );


    line.className =
        'log-line';


    line.innerHTML = `

        <span style="
            color:var(--cyan);
        ">
            &gt;
        </span>

        ${text}

    `;


    box.appendChild(
        line
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   VOICE
========================================================= */

function speak(text) {


    if (
        !('speechSynthesis' in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.pitch =
        selectedGender === 'female'
            ? 1.1
            : .9;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   GENDER
========================================================= */

function setGender(gender) {


    selectedGender =
        gender;


    document
        .getElementById(
            'btn-female'
        )
        .classList
        .toggle(
            'active',
            gender === 'female'
        );


    document
        .getElementById(
            'btn-male'
        )
        .classList
        .toggle(
            'active',
            gender === 'male'
        );

}


/* =========================================================
   GAME INITIALIZATION
========================================================= */

async function initGame() {


    gameState.name =

        document
            .getElementById(
                'player-name-input'
            )
            .value
            .trim()
            ||
            'Explorer1';


    gameState.zip =

        document
            .getElementById(
                'zip-input'
            )
            .value
            .trim()
            ||
            '23185';


    gameState.transport =

        document
            .getElementById(
                'transport-input'
            )
            .value;


    /*
       Try the free ZIP lookup.
    */

    try {

        addLog(
            `LOCATING ZIP CODE // ${gameState.zip}`
        );


        const location =
            await getCoordinatesFromZip(
                gameState.zip
            );


        gameState.lat =
            location.lat;


        gameState.lng =
            location.lng;


        gameState.city =
            location.city;


        gameState.state =
            location.state;


        addLog(

            `LOCATION LOCKED // ${location.city}, ${location.state}`

        );


    } catch(error) {


        /*
           The game still works if the
           ZIP service temporarily fails.
        */

        addLog(

            `LOCATION LOOKUP FAILED // ${error.message}`

        );


        addLog(

            'DEFAULT MAP LOCATION LOADED.'

        );

    }


    /*
       Initialize visual map.
    */

    initMap(

        gameState.lat,
        gameState.lng

    );


    /*
       Start game.
    */

    gameStarted =
        true;


    /*
       Start live point timer.
    */

    startLivePointSystem();


    /*
       Refresh interface.
    */

    updateUI();


    addLog(

        `QUEST INITIALIZED // Welcome ${gameState.name}.`

    );


    addLog(

        'LIVE POINT ACCUMULATION ACTIVE.'

    );


    speak(

        `Welcome ${gameState.name}. Quest initialized.`

    );

}


/* =========================================================
   LIVE POINT SYSTEM
========================================================= */

function startLivePointSystem() {


    if (gameTimer) {

        clearInterval(
            gameTimer
        );

    }


    gameTimer =

        setInterval(

            () => {


                if (
                    !gameStarted
                ) {

                    return;

                }


                /*
                   Players in jail don't earn
                   normal open-world points.
                */

                if (
                    gameState.arrested
                ) {

                    return;

                }


                /*
                   Every second of active
                   gameplay adds one point.
                */

                gameState.playSeconds++;

                gameState.points++;


                /*
                   Reserve points gradually
                   regenerate while playing.
                */

                if (
                    gameState.reservePoints <
                    100
                ) {

                    gameState.reservePoints =

                        Math.min(

                            100,

                            gameState.reservePoints
                            +
                            0.1

                        );

                }


                /*
                   Students gain career XP.
                */

                if (
                    gameState.education
                ) {

                    gameState.careerXP++;

                }


                updateUI();

            },

            1000

        );

}

   AWARD POINTS
========================================================= */

    amount,

) {


    gameState.points +=
        amount;


    const display =
        document.getElementById(
            'points-display'
        );


    display.classList.remove(
        'pulse'
    );


    void display.offsetWidth;


    display.classList.add(
        'pulse'
    );


    addLog(

        `+${amount} POINTS // ${reason}`

    );


    updateUI();

}

   DICE / MOVEMENT
========================================================= */

function rollDice() {


    if (
        !gameStarted
    ) {

        alert(
            'Initialize the quest first.'
        );

        return;

    }


    if (
        gameState.arrested
    ) {

        alert(
            'You are currently in jail.'
        );

        return;

    }


    if (
        gameState.hidden
    ) {

        alert(
            'You are hiding. Exit hiding first.'
        );

        return;

    }


    const roll =
        Math.floor(
            Math.random() * 6
        ) + 1;


    let bonus =
        0;


    if (
        gameState.transport ===
        'car'
    ) {

        bonus =
            2;

    } else if (
        gameState.transport ===
        'bike'
    ) {

        bonus =
            1;

    }


    movesLeft =
        roll + bonus;


    document
        .getElementById(
            'moves-count'
        )
        .innerText =
        movesLeft;


    addLog(

        `MOVEMENT ROLL // ${roll} + ${bonus} transport bonus`

    );


    /*
       Protected education players
       don't lose life from normal movement.
    */

    if (
        !gameState.protected
    ) {

        gameState.life =

            Math.max(

                0,

                gameState.life -
                2

            );

    }


    updateUI();

}

    movesLeft--;


    document

        ]

    );


    updateUI();

}


/* =========================================================
   REPORT CRIME
========================================================= */

function reportCrime(
    type
) {


    gameState.crimesWitnessed++;


    addLog(
        `CRIME REPORTED // ${type}`
    );


    /*
       If player is a police officer,
       give them the officer response.
    */

    if (
        gameState.career ===
        'police'
    ) {

        showOfficerResponse(
            type
        );

        return;

    }


    showModal(

        'POLICE RESPONSE',

        `

            Dispatch received your
            ${type} report.

            Officers are responding to
            the simulated game incident.

        `,

        [

            {

                text:
                    'CLOSE',

                action:
                    closeModal

            }

        ]

    );

}


/* =========================================================
   OFFICER RESPONSE
========================================================= */

function showOfficerResponse(
    type
) {


    showModal(

        'OFFICER RESPONSE',

        `

            INCIDENT TYPE:

            ${type}

            As a certified game police
            officer, you can initiate
            the fictional arrest mechanic.

        `,

        [

            {

                text:
                    'ARREST SUSPECT',

                action:
                    () =>
                    arrestSuspect(
                        type
                    )

            },

            {

                text:
                    'DISENGAGE',

                action:
                    closeModal

            }

        ]

    );

}


function arrestSuspect(
    type
) {


    gameState.careerXP +=
        30;


    awardPoints(

        75,

        `ARREST COMPLETED // ${type}`

    );


    addLog(
        `SUSPECT ARRESTED // ${type}`
    );


    closeModal();


    updateUI();

}


/* =========================================================
   HIRE LAWYER
========================================================= */

function hireLawyer() {


    const cost =
        100;


    if (
        gameState.points <
        cost
    ) {

        alert(
            `Hiring a lawyer costs ${cost} points.`
        );

        return;

    }


    gameState.points -=
        cost;


    gameState.lawyerHired =
        true;


    addLog(
        'LEGAL COUNSEL RETAINED'
    );


    showModal(

        'LEGAL COUNSEL',

        `

            Your game lawyer is now retained.

            If you are arrested, legal counsel
            can reduce your simulated jail
            sentence.

        `,

        [

            {

                text:
                    'CLOSE',

                action:
                    closeModal

            }

        ]

    );


    updateUI();

}


/* =========================================================
   HIDING / EVASION
========================================================= */

function openHideoutMenu() {


    if (
        gameState.protected
    ) {

        alert(
            'You are already protected while attending education.'
        );

        return;

    }


    if (
        gameState.hidden
    ) {

        exitHideout();

        return;

    }


    showModal(

        'EVASION NETWORK',

        `

            Hide temporarily from detection.

            Hiding consumes reserve points.

            Available locations:

        `,

        [

            {

                text:
                    'TRASH CONTAINER',

                action:
                    () =>
                    enterHideout(
                        'TRASH CONTAINER',
                        5
                    )

            },

            {

                text:
                    'ABANDONED BUILDING',

                action:
                    () =>
                    enterHideout(
                        'ABANDONED BUILDING',
                        10
                    )

            },

            {

                text:
                    'DARK ALLEY',

                action:
                    () =>
                    enterHideout(
                        'DARK ALLEY',
                        7
                    )

            },

            {

                text:
                    'CANCEL',

                action:
                    closeModal

            }

        ]

    );

}


function enterHideout(
    place,
    cost
) {


    if (
        gameState.reservePoints <
        cost
    ) {

        alert(
            'Not enough reserve points.'
        );

        return;

    }


    gameState.reservePoints -=
        cost;


    gameState.hidden =
        true;


    gameState.hidingPlace =
        place;


    addLog(

        `HIDDEN // ${place} // -${cost} RESERVE`

    );


    closeModal();


    updateProtection();


    updateUI();

}


function exitHideout() {


    addLog(

        `LEFT HIDEOUT // ${gameState.hidingPlace}`

    );


    gameState.hidden =
        false;


    gameState.hidingPlace =
        null;


    updateProtection();


    updateUI();

}


/* =========================================================
   JAIL
========================================================= */

function arrestPlayer() {


    /*
       Educational protection.
    */

    if (
        gameState.protected
    ) {

        addLog(
            'ARREST BLOCKED // EDUCATION PROTECTION ACTIVE'
        );

        return;

    }


    gameState.arrested =
        true;


    gameState.jailSeconds =
        120;


    /*
       Current lawyer contract is consumed
       when used for this arrest.
    */

    if (
        gameState.lawyerHired
    ) {

        gameState.jailSeconds =
            60;

        gameState.lawyerHired =
            false;

        addLog(
            'LEGAL COUNSEL ACTIVATED // JAIL SENTENCE REDUCED'
        );

    }


    addLog(
        'PLAYER ARRESTED // TRANSPORTED TO GAME JAIL'
    );


    startJailTimer();


    updateUI();

}


function startJailTimer() {


    if (jailTimer) {

        clearInterval(
            jailTimer
        );

    }


    jailTimer =

        setInterval(

            () => {


                if (
                    gameState.jailSeconds <=
                    0
                ) {

                    releaseFromJail();

                    return;

                }


                gameState.jailSeconds--;


                updateUI();

            },

            1000

        );

}


function releaseFromJail() {


    clearInterval(
        jailTimer
    );


    gameState.arrested =
        false;


    gameState.jailSeconds =
        0;


    addLog(
        'RELEASED // JAIL SENTENCE COMPLETE'
    );


    updateUI();

}


/* =========================================================
   LIFE RESTORATION
========================================================= */

function replenishFoodWater() {


    const cost =
        20;


    if (
        gameState.points <
        cost
    ) {

        alert(
            'Restoration costs 20 points.'
        );

        return;

    }


    gameState.points -=
        cost;


    gameState.life =
        100;


    addLog(
        'LIFE SYSTEM RESTORED // -20 POINTS'
    );


    updateUI();

}


/* =========================================================
   PROTECTION STATUS
========================================================= */

function updateProtection() {


    const status =
        document.getElementById(
            'protection-status'
        );


    if (
        gameState.hidden
    ) {

        status.innerText =
            `● HIDDEN // ${gameState.hidingPlace}`;

        status.style.color =
            '#a855ff';

        return;

    }


    if (
        gameState.protected
    ) {

        status.innerText =
            '● EDUCATION PROTECTION ACTIVE';

        status.style.color =
            '#20ff91';

        return;

    }


    if (
        gameState.arrested
    ) {

        status.innerText =
            '● INCARCERATED';

        status.style.color =
            '#ff3159';

        return;

    }


    status.innerText =
        '● OPEN WORLD';

    status.style.color =
        '#20ff91';

}


/* =========================================================
   UPDATE USER INTERFACE
========================================================= */

function updateUI() {


    /*
       Points
    */

    document
        .getElementById(
            'points-display'
        )
        .innerText =
        Math.floor(
            gameState.points
        );


    /*
       Reserve
    */

    document
        .getElementById(
            'reserve-display'
        )
        .innerText =
        Math.floor(
            gameState.reservePoints
        );


    document
        .getElementById(
            'reserve-text'
        )
        .innerText =
        Math.floor(
            gameState.reservePoints
        );


    /*
       Clues
    */

    document
        .getElementById(
            'clue-display'
        )
        .innerText =
        gameState.clues;


    /*
       Crime reports
    */

    document
        .getElementById(
            'crime-display'
        )
        .innerText =
        gameState.crimesWitnessed;


    /*
       Time
    */

    document
        .getElementById(
            'time-display'
        )
        .innerText =
        formatTime(
            gameState.playSeconds
        );


    /*
       Life
    */

    document
        .getElementById(
            'life-text'
        )
        .innerText =
        Math.floor(
            gameState.life
        );


    document
        .getElementById(
            'life-bar'
        )
        .style.width =
        `${gameState.life}%`;


    /*
       Reserve bar
    */

    document
        .getElementById(
            'reserve-bar'
        )
        .style.width =
        `${gameState.reservePoints}%`;


    /*
       Career XP
    */

    document
        .getElementById(
            'career-xp-text'
        )
        .innerText =
        Math.floor(
            gameState.careerXP
        );


    document
        .getElementById(
            'career-xp-bar'
        )
        .style.width =
        `${gameState.careerXP % 100}%`;


    /*
       Career information.
    */

    const career =
        careers[
            gameState.career
        ] ||
        careers.civilian;


    document
        .getElementById(
            'career-name'
        )
        .innerText =
        career.name;


    const careerIcon =
        document.getElementById(
            'career-icon'
        );


    careerIcon.className =
        `fa-solid ${career.icon}`;


    careerIcon.style.color =
        career.color;


    let status =
        'Open World Player';


    if (
        gameState.career ===
        'policeStudent'
    ) {

        status =
            `Academy Level ${gameState.academyLevel}/3`;

    }


    if (
        gameState.career ===
        'police'
    ) {

        status =
            'Certified Game Officer';

    }


    if (
        gameState.career ===
        'lawStudent'
    ) {

        status =
            `Law Level ${gameState.lawLevel}/3`;

    }


    if (
        gameState.career ===
        'lawyer'
    ) {

        status =
            'Licensed Game Lawyer';

    }


    if (
        gameState.career ===
        'college'
    ) {

        status =
            'College Student';

    }


    if (
        gameState.arrested
    ) {

        status =
            `JAIL // ${formatTime(
                gameState.jailSeconds
            )}`;

    }


    document
        .getElementById(
            'career-status'
        )
        .innerText =
        status;


    updateProtection();

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(
    seconds
) {


    const mins =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (

        String(mins)
            .padStart(2,'0')

        +

        ':'

        +

        String(secs)
            .padStart(2,'0')

    );

}


/* =========================================================
   MODAL SYSTEM
========================================================= */

function showModal(
    heading,
    body,
    actions = []
) {


    document
        .getElementById(
            'modal-heading'
        )
        .innerText =
        heading;


    document
        .getElementById(
            'modal-body'
        )
        .innerHTML =
        body;


    const container =
        document.getElementById(
            'modal-actions'
        );


    container.innerHTML =
        '';


    actions.forEach(

        action => {


            const button =
                document.createElement(
                    'button'
                );


            button.className =
                'option-btn';


            button.innerText =
                action.text;


            button.onclick =
                action.action;


            container.appendChild(
                button
            );

        }

    );


    document
        .getElementById(
            'modal-screen'
        )
        .style.display =
        'flex';

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {


    document
        .getElementById(
            'modal-screen'
        )
        .style.display =
        'none';

}


/* =========================================================
   ESCAPE KEY CLOSES MODAL
========================================================= */

document.addEventListener(

    'keydown',

    function(event) {

        if (
            event.key ===
            'Escape'
        ) {

            closeModal();

        }

    }

);


/* =========================================================
   INITIAL STARTUP
========================================================= */

window.onload =
    function() {


        /*
           Show the default map before
           the player starts.
        */

        initMap(

            gameState.lat,
            gameState.lng

        );


        addLog(
            'NEXUS SYSTEM ONLINE'
        );


        addLog(
            'FREE OPENSTREETMAP NAVIGATION READY'
        );


        addLog(
            'ENTER ZIP CODE AND INITIALIZE QUEST'
        );


        updateUI();

    };


</script>
