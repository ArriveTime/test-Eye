<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Realistic AI Hair Color & Style Studio</title>
  
  <!-- MediaPipe Camera Utils & Dedicated Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(21, 29, 48, 0.85);
      --border: rgba(255, 255, 255, 0.15);
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; color: #a78bfa; margin-bottom: 4px; }
    p { color: var(--text-muted); font-size: 0.9rem; }

    .studio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
    }

    @media (min-width: 768px) {
      .studio-grid { grid-template-columns: 1fr 1fr; }
    }

    .viewport-card {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .viewport-card header {
      position: absolute;
      top: 10px; left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .mirror { transform: scaleX(-1); }

    .controls-dock {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .swatch:hover { transform: scale(1.1); }
    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .slider-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .slider-field {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }
  </style>
</head>
<body>

  <header>
    <h1>Realistic AI Hair Color Studio</h1>
    <p>Realistic Strand-Level Masking & Photorealistic Color Blending</p>
  </header>

  <div class="studio-grid">
    <div class="viewport-card">
      <header style="color:#94a3b8">1. Original Feed</header>
      <video id="webcam" class="mirror" playsinline></video>
    </div>

    <div class="viewport-card">
      <header style="color:#c4b5fd">2. Realistic Transformed Hair</header>
      <canvas id="outputCanvas" class="mirror"></canvas>
    </div>
  </div>

  <div class="controls-dock">
    <div>
      <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Salon Color Palette</div>
      <div class="swatch-row">
        <!-- Natural & Fantasy Tones -->
        <div class="swatch selected" style="background: #d4a359;" data-color="rgb(212, 163, 89)" data-hue="40"></div> <!-- Honey Blonde -->
        <div class="swatch" style="background: #8b3a2b;" data-color="rgb(139, 58, 43)" data-hue="10"></div>   <!-- Auburn Red -->
        <div class="swatch" style="background: #4a2c11;" data-color="rgb(74, 44, 17)" data-hue="25"></div>   <!-- Dark Chestnut -->
        <div class="swatch" style="background: #e63946;" data-color="rgb(230, 57, 70)" data-hue="355"></div>  <!-- Cherry Velvet -->
        <div class="swatch" style="background: #2a9d8f;" data-color="rgb(42, 157, 143)" data-hue="170"></div> <!-- Emerald Pearl -->
        <div class="swatch" style="background: #7209b7;" data-color="rgb(114, 9, 183)" data-hue="280"></div>  <!-- Violet Plum -->
        <div class="swatch" style="background: #f72585;" data-color="rgb(247, 37, 133)" data-hue="330"></div>  <!-- Magenta -->
      </div>
    </div>

    <div class="slider-group">
      <div class="slider-field">
        <label>Color Intensity <span id="opacityVal">70%</span></label>
        <input type="range" id="opacitySlider" min="20" max="100" value="70">
      </div>
      <div class="slider-field">
        <label>Edge Softness (Feathering) <span id="featherVal">4px</span></label>
        <input type="range" id="featherSlider" min="0" max="12" value="4">
      </div>
    </div>

    <button id="snapBtn" class="btn">📷 Download High-Res Snapshot</button>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const featherSlider = document.getElementById('featherSlider');
    const featherVal = document.getElementById('featherVal');
    const snapBtn = document.getElementById('snapBtn');

    let activeColor = 'rgb(212, 163, 89)';
    let dyeOpacity = 0.7;
    let featherAmount = 4;

    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        activeColor = swatch.getAttribute('data-color');
      });
    });

    opacitySlider.addEventListener('input', (e) => {
      dyeOpacity = e.target.value / 100;
      opacityVal.innerText = `${e.target.value}%`;
    });

    featherSlider.addEventListener('input', (e) => {
      featherAmount = parseInt(e.target.value, 10);
      featherVal.innerText = `${featherAmount}px`;
    });

    function onSegmentationResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // Render base video to canvas
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (results.segmentationMask) {
        // Offscreen Canvas for Hair Mask Processing
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w;
        maskCanvas.height = h;
        const maskCtx = maskCanvas.getContext('2d');

        // Draw segmented mask
        maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);

        // Apply edge-feathering to eliminate blocky boundaries
        if (featherAmount > 0) {
          maskCtx.filter = `blur(${featherAmount}px)`;
          maskCtx.drawImage(maskCanvas, 0, 0);
          maskCtx.filter = 'none';
        }

        // Realistic Multi-Layer Color Compositing Pipeline
        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = w;
        colorCanvas.height = h;
        const colorCtx = colorCanvas.getContext('2d');

        // Base video reference
        colorCtx.drawImage(results.image, 0, 0, w, h);

        // Layer 1: HSL Color Blend Mode (Shifts hair tint while preserving luminance/shadows)
        colorCtx.globalCompositeOperation = 'color';
        colorCtx.fillStyle = activeColor;
        colorCtx.globalAlpha = dyeOpacity;
        colorCtx.fillRect(0, 0, w, h);

        // Layer 2: Soft Light (Restores natural strand highlights and depth)
        colorCtx.globalCompositeOperation = 'soft-light';
        colorCtx.fillStyle = activeColor;
        colorCtx.globalAlpha = dyeOpacity * 0.6;
        colorCtx.fillRect(0, 0, w, h);

        // Masking Step: Retain ONLY hair region using destination-in
        colorCtx.globalCompositeOperation = 'destination-in';
        colorCtx.drawImage(maskCanvas, 0, 0);

        // Draw final hair blend over original camera stream
        canvasCtx.drawImage(colorCanvas, 0, 0);
      }

      canvasCtx.restore();
    }

    // Initialize Selfie Segmentation set to High-Precision Model (Index 1)
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults(onSegmentationResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await selfieSegmentation.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start().catch(err => alert("Camera access required for live hair studio."));

    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'realistic-hair-transformation.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
