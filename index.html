<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BowlStrike.com - Pro Tour Lanes</title>
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: linear-gradient(145deg, #121620 0%, #0a0d14 100%);
      --accent-gold: #d4af37;
      --accent-cyan: #00e5ff;
      --text-main: #f0f4f8;
      --text-muted: #7f8c9d;
      --border-color: #1e2636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* Scoreboard HUD */
    #scoreboard {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-top-bar {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 6px;
    }

    .hud-group {
      text-align: center;
      flex: 1;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .hud-group:last-child {
      border-right: none;
    }

    .hud-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    .hud-value.highlight {
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    .hud-value.gold {
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    /* Game Canvas Container */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d3748;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    /* Controls Bar */
    #controls-panel {
      width: 100%;
      max-width: 540px;
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 6px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .instructions {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .instructions strong {
      color: var(--text-main);
    }

    .mode-select {
      background: #121722;
      color: var(--text-main);
      border: 1px solid #3b485d;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .btn-pro {
      background: linear-gradient(180deg, #242d3c 0%, #121722 100%);
      color: var(--text-main);
      border: 1px solid #3b485d;
      padding: 7px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pro:hover {
      border-color: var(--accent-gold);
      color: #ffffff;
    }

    #game-overlay {
      position: absolute;
      top: 32%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.9), 0 4px 8px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: scale(0.85);
      z-index: 10;
      font-style: italic;
    }

    #game-overlay.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <div id="scoreboard">
    <div class="hud-row hud-top-bar">
      <div class="hud-group">
        <div class="hud-label">Turn</div>
        <div class="hud-value highlight" id="player-turn-display">PLAYER 1</div>
      </div>
      <div class="hud-group">
        <div class="hud-label">Top Score</div>
        <div class="hud-value gold" id="top-score-display">0</div>
      </div>
    </div>
    <div class="hud-row">
      <div class="hud-group">
        <div class="hud-label">Frame</div>
        <div class="hud-value" id="frame-display">1 / 10</div>
      </div>
      <div class="hud-group">
        <div class="hud-label">Shot</div>
        <div class="hud-value" id="ball-display">1</div>
      </div>
      <div class="hud-group">
        <div class="hud-label">P1 Score</div>
        <div class="hud-value" id="p1-score-display">0</div>
      </div>
      <div class="hud-group" id="p2-score-group" style="display: none;">
        <div class="hud-label">P2 Score</div>
        <div class="hud-value" id="p2-score-display">0</div>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="bowlingCanvas" width="500" height="720"></canvas>
    <div id="game-overlay">STRIKE!</div>
  </div>

  <div id="controls-panel">
    <div class="control-row">
      <div class="instructions" id="instruction-text">
        <strong>Swipe / Drag backward</strong> behind the foul line to roll.
      </div>
    </div>
    <div class="control-row">
      <div>
        <label for="modeSelect" class="hud-label" style="margin-right: 6px;">Players:</label>
        <select id="modeSelect" class="mode-select" onchange="changeMode(this.value)">
          <option value="1">1 Player</option>
          <option value="2">2 Players</option>
        </select>
      </div>
      <button class="btn-pro" onclick="resetGame()">Reset Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bowlingCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('game-overlay');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playRollSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(130, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.2);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playPinSound(count) {
      if (!audioCtx) return;
      const duration = 0.5;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, audioCtx.currentTime);
      filter.Q.setValueAtTime(2.2, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(Math.min(0.3 + count * 0.08, 0.85), audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playCheerSound() {
      if (!audioCtx) return;
      const duration = 2.8;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.12;
        b6 = white * 0.115926;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(950, audioCtx.currentTime);
      filter.Q.setValueAtTime(1.0, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // Multiplayer & High Score Setup
    let numPlayers = 1;
    let activePlayer = 0; // 0 for P1, 1 for P2
    let topScore = parseInt(localStorage.getItem('bowlStrike_topScore') || '0', 10);

    function createPlayerState() {
      return {
        currentFrame: 1,
        currentRoll: 1,
        totalScore: 0,
        gameOver: false,
        frameRolls: Array.from({ length: 10 }, () => [])
      };
    }

    let players = [createPlayerState(), createPlayerState()];
    const FOUL_LINE_Y = 580;

    let ball = {
      x: 250,
      y: 645,
      radius: 16,
      vx: 0,
      vy: 0,
      isRolling: false,
      canAim: true,
      hasHitPins: false,
      rotation: 0
    };

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    const pinOrigins = [
      { id: 1,  row: 1, col: 1, x: 250, y: 200 }, 
      { id: 2,  row: 2, col: 1, x: 222, y: 177 },
      { id: 3,  row: 2, col: 2, x: 278, y: 177 },
      { id: 4,  row: 3, col: 1, x: 194, y: 154 },
      { id: 5,  row: 3, col: 2, x: 250, y: 154 },
      { id: 6,  row: 3, col: 3, x: 306, y: 154 },
      { id: 7,  row: 4, col: 1, x: 166, y: 131 },
      { id: 8,  row: 4, col: 2, x: 222, y: 131 },
      { id: 9,  row: 4, col: 3, x: 278, y: 131 },
      { id: 10, row: 4, col: 4, x: 334, y: 131 }
    ];

    let pins = [];

    function initPins() {
      pins = pinOrigins.map(p => ({
        ...p,
        isStanding: true,
        knockedX: 0,
        knockedY: 0,
        opacity: 1
      }));
    }

    function getScale(y) {
      return 0.38 + (y / 720) * 0.62;
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleStart(e) {
      initAudio();
      const p = players[activePlayer];
      if (!ball.canAim || ball.isRolling || p.gameOver) return;
      const pos = getCanvasCoordinates(e);
      if (Math.hypot(pos.x - ball.x, pos.y - ball.y) < 60) {
        isDragging = true;
        dragStart = pos;
        dragCurrent = pos;
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      dragCurrent = getCanvasCoordinates(e);
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;

      if (dy > 15) {
        ball.vx = -dx * 0.12;
        ball.vy = -dy * 0.22;
        ball.vy = Math.max(ball.vy, -19);
        ball.vx = Math.max(Math.min(ball.vx, 8.5), -8.5);
        
        ball.isRolling = true;
        ball.canAim = false;
        ball.hasHitPins = false;

        playRollSound();
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: true });
    canvas.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    function showOverlay(text) {
      overlay.innerText = text;
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 1800);
    }

    function update() {
      if (ball.isRolling) {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy *= 0.993;
        ball.rotation += Math.abs(ball.vy) * 0.08;

        let hitThisFrame = 0;

        pins.forEach(pin => {
          if (pin.isStanding) {
            const dist = Math.hypot(ball.x - pin.x, ball.y - pin.y);
            const scale = getScale(pin.y);
            if (dist < (ball.radius + 24 * scale)) {
              pin.isStanding = false;
              pin.knockedX = (pin.x - ball.x) * 1.0 + (Math.random() - 0.5) * 14;
              pin.knockedY = -Math.abs(ball.vy) * 0.65;
              hitThisFrame++;
            }
          }
        });

        pins.forEach(pin1 => {
          if (!pin1.isStanding && pin1.opacity > 0.5) {
            pins.forEach(pin2 => {
              if (pin2.isStanding) {
                const dist = Math.hypot(pin1.x - pin2.x, pin1.y - pin2.y);
                if (dist < 34) {
                  pin2.isStanding = false;
                  pin2.knockedX = (pin2.x - pin1.x) * 0.9 + (Math.random() - 0.5) * 12;
                  pin2.knockedY = pin1.knockedY * 0.8;
                  hitThisFrame++;
                }
              }
            });
          }
        });

        if (hitThisFrame > 0 && !ball.hasHitPins) {
          playPinSound(hitThisFrame);
          ball.hasHitPins = true;
        }

        pins.forEach(pin => {
          if (!pin.isStanding && pin.opacity > 0) {
            pin.x += pin.knockedX;
            pin.y += pin.knockedY;
            pin.knockedX *= 0.88;
            pin.knockedY *= 0.88;
            pin.opacity -= 0.025;
          }
        });

        if (ball.y < 110 || Math.abs(ball.vy) < 0.2) {
          endRoll();
        }
      }
    }

    function endRoll() {
      ball.isRolling = false;
      const p = players[activePlayer];

      const knockedThisRoll = pins.filter(pin => !pin.isStanding && pin.opacity > 0).length;
      pins.forEach(pin => { if (!pin.isStanding) pin.opacity = 0; });

      p.frameRolls[p.currentFrame - 1].push(knockedThisRoll);
      const standingCount = pins.filter(pin => pin.isStanding).length;

      let advanceTurn = false;

      // Frames 1-9
      if (p.currentFrame < 10) {
        if (p.currentRoll === 1) {
          if (knockedThisRoll === 10) {
            showOverlay("STRIKE!");
            playCheerSound();
            p.currentFrame++;
            p.currentRoll = 1;
            advanceTurn = true;
          } else {
            p.currentRoll = 2;
            resetBall();
          }
        } else { // Roll 2
          if (standingCount === 0) {
            showOverlay("SPARE!");
            playCheerSound();
          } else if (knockedThisRoll === 0) {
            showOverlay("GUTTER!");
          }
          p.currentFrame++;
          p.currentRoll = 1;
          advanceTurn = true;
        }
      } 
      // Frame 10 Special Rules
      else {
        if (p.currentRoll === 1) {
          if (knockedThisRoll === 10) {
            showOverlay("STRIKE!");
            playCheerSound();
            initPins();
          }
          p.currentRoll = 2;
          resetBall();
        } else if (p.currentRoll === 2) {
          const firstRoll = p.frameRolls[9][0];
          if (firstRoll === 10 && knockedThisRoll === 10) {
            showOverlay("STRIKE!");
            playCheerSound();
            initPins();
            p.currentRoll = 3;
            resetBall();
          } else if (firstRoll < 10 && (firstRoll + knockedThisRoll === 10)) {
            showOverlay("SPARE!");
            playCheerSound();
            initPins();
            p.currentRoll = 3;
            resetBall();
          } else if (firstRoll === 10 && knockedThisRoll < 10) {
            p.currentRoll = 3;
            resetBall();
          } else {
            p.gameOver = true;
            advanceTurn = true;
          }
        } else if (p.currentRoll === 3) {
          if (knockedThisRoll === 10) {
            showOverlay("STRIKE!");
            playCheerSound();
          }
          p.gameOver = true;
          advanceTurn = true;
        }
      }

      calculateOfficialScore(p);
      updateTopScore(p.totalScore);

      if (advanceTurn) {
        setTimeout(() => {
          switchTurn();
        }, 1000);
      } else {
        updateUI();
      }
    }

    function switchTurn() {
      if (numPlayers === 2) {
        // Toggle player if other player is not finished
        if (!players[1 - activePlayer].gameOver) {
          activePlayer = 1 - activePlayer;
        }
      }

      // Check if both or single player finished
      if (players[activePlayer].gameOver) {
        finishGame();
      } else {
        initPins();
        resetBall();
        updateUI();
      }
    }

    function finishGame() {
      showOverlay("GAME OVER");
      let text = "";
      if (numPlayers === 1) {
        text = `<strong>Game Over!</strong> Final Score: ${players[0].totalScore}`;
      } else {
        const p1 = players[0].totalScore;
        const p2 = players[1].totalScore;
        let winner = "Tie Game!";
        if (p1 > p2) winner = "Player 1 Wins!";
        else if (p2 > p1) winner = "Player 2 Wins!";
        text = `<strong>Game Over! ${winner}</strong> (P1: ${p1} | P2: ${p2})`;
      }
      document.getElementById('instruction-text').innerHTML = text;
      updateUI();
    }

    function calculateOfficialScore(p) {
      let score = 0;
      let flatRolls = [];
      p.frameRolls.forEach(f => flatRolls.push(...f));

      let rollIdx = 0;
      for (let f = 0; f < 10; f++) {
        if (rollIdx >= flatRolls.length) break;

        // Strike
        if (flatRolls[rollIdx] === 10) {
          if (rollIdx + 2 < flatRolls.length) {
            score += 10 + flatRolls[rollIdx + 1] + flatRolls[rollIdx + 2];
          }
          rollIdx += 1;
        } 
        // Spare
        else if (rollIdx + 1 < flatRolls.length && (flatRolls[rollIdx] + flatRolls[rollIdx + 1] === 10)) {
          if (rollIdx + 2 < flatRolls.length) {
            score += 10 + flatRolls[rollIdx + 2];
          }
          rollIdx += 2;
        } 
        // Open frame
        else if (rollIdx + 1 < flatRolls.length) {
          score += flatRolls[rollIdx] + flatRolls[rollIdx + 1];
          rollIdx += 2;
        }
      }

      p.totalScore = score;
    }

    function updateTopScore(score) {
      if (score > topScore) {
        topScore = score;
        localStorage.setItem('bowlStrike_topScore', topScore);
      }
    }

    function resetBall() {
      ball.x = 250;
      ball.y = 645;
      ball.vx = 0;
      ball.vy = 0;
      ball.isRolling = false;
      ball.canAim = true;
    }

    function changeMode(val) {
      numPlayers = parseInt(val, 10);
      resetGame();
    }

    function resetGame() {
      activePlayer = 0;
      players = [createPlayerState(), createPlayerState()];
      
      document.getElementById('p2-score-group').style.display = (numPlayers === 2) ? 'block' : 'none';
      document.getElementById('instruction-text').innerHTML = 
        `<strong>Swipe / Drag backward</strong> behind the foul line to roll.`;
      
      initPins();
      resetBall();
      updateUI();
    }

    function updateUI() {
      const p = players[activePlayer];
      
      document.getElementById('player-turn-display').innerText = `PLAYER ${activePlayer + 1}`;
      document.getElementById('top-score-display').innerText = topScore;
      document.getElementById('frame-display').innerText = `${Math.min(p.currentFrame, 10)} / 10`;
      document.getElementById('ball-display').innerText = p.currentRoll;
      document.getElementById('p1-score-display').innerText = players[0].totalScore;
      document.getElementById('p2-score-display').innerText = players[1].totalScore;
    }

    // Canvas Rendering Engine
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. BACKDROP & OVERHEAD MASKING UNIT
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, 120);

      // Casing Box
      const panelGrad = ctx.createLinearGradient(0, 0, 0, 100);
      panelGrad.addColorStop(0, '#1a202c');
      panelGrad.addColorStop(0.5, '#0f141d');
      panelGrad.addColorStop(1, '#080b10');
      ctx.fillStyle = panelGrad;
      ctx.fillRect(40, 10, 420, 90);

      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 3;
      ctx.strokeRect(40, 10, 420, 90);

      // Header Text
      ctx.font = '900 31px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textBaseline = 'middle';

      const bowlWidth = ctx.measureText("BOWL").width;
      const strikeWidth = ctx.measureText("STRIKE.COM").width;
      const totalWidth = bowlWidth + strikeWidth;
      const startX = 250 - (totalWidth / 2);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 12;
      ctx.fillText("BOWL", startX, 55);

      ctx.fillStyle = '#ff2a2a';
      ctx.shadowColor = 'rgba(255, 42, 42, 0.85)';
      ctx.shadowBlur = 14;
      ctx.fillText("STRIKE.COM", startX + bowlWidth, 55);
      
      ctx.shadowBlur = 0;

      // Ambient Pin Light Glow
      const pitGlow = ctx.createRadialGradient(250, 125, 10, 250, 125, 180);
      pitGlow.addColorStop(0, 'rgba(255, 235, 200, 0.25)');
      pitGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = pitGlow;
      ctx.fillRect(50, 100, 400, 110);

      // Pit Cavity Back Wall Depth
      ctx.fillStyle = '#030406';
      ctx.fillRect(100, 100, 300, 25);

      // 2. APPROACH HARDWOOD FLOOR
      const approachGrad = ctx.createLinearGradient(0, FOUL_LINE_Y, 0, 720);
      approachGrad.addColorStop(0, '#b87c33');
      approachGrad.addColorStop(1, '#8f5c20');
      ctx.fillStyle = approachGrad;
      ctx.fillRect(0, FOUL_LINE_Y, canvas.width, 720 - FOUL_LINE_Y);

      // 3. MAIN MAPLE WOOD LANE FLOOR
      const laneGrad = ctx.createLinearGradient(0, 125, 0, FOUL_LINE_Y);
      laneGrad.addColorStop(0, '#8c5822');  
      laneGrad.addColorStop(0.5, '#ad7533'); 
      laneGrad.addColorStop(1, '#ca8d3e');   

      ctx.beginPath();
      ctx.moveTo(140, 125);  
      ctx.lineTo(360, 125);  
      ctx.lineTo(475, FOUL_LINE_Y);  
      ctx.lineTo(25, FOUL_LINE_Y);   
      ctx.closePath();
      ctx.fillStyle = laneGrad;
      ctx.fill();

      // Board Planks Shading
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      for (let i = -8; i <= 8; i++) {
        ctx.beginPath();
        ctx.moveTo(250 + i * 11, 125);
        ctx.lineTo(250 + i * 27, FOUL_LINE_Y);
        ctx.stroke();
      }

      // Wax Sheen Reflections
      const waxGrad = ctx.createLinearGradient(0, 200, 0, FOUL_LINE_Y);
      waxGrad.addColorStop(0, 'rgba(255, 255, 255, 0.0)');
      waxGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.06)');
      waxGrad.addColorStop(1, 'rgba(255, 255, 255, 0.16)');
      ctx.fillStyle = waxGrad;
      ctx.fill();

      // 4. GUTTERS
      ctx.fillStyle = '#11151c';
      ctx.beginPath();
      ctx.moveTo(80, 125); ctx.lineTo(140, 125); ctx.lineTo(25, FOUL_LINE_Y); ctx.lineTo(0, FOUL_LINE_Y);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(360, 125); ctx.lineTo(420, 125); ctx.lineTo(500, FOUL_LINE_Y); ctx.lineTo(475, FOUL_LINE_Y);
      ctx.fill();

      // 5. TARGETING ARROWS & FOUL LINE
      ctx.fillStyle = '#42280c';
      [-60, -40, -20, 0, 20, 40, 60].forEach(offset => {
        const scale = getScale(420);
        const ax = 250 + offset * 2.1;
        ctx.beginPath();
        ctx.moveTo(ax, 420);
        ctx.lineTo(ax - 3 * scale, 432);
        ctx.lineTo(ax + 3 * scale, 432);
        ctx.closePath();
        ctx.fill();
      });

      // Foul Line
      ctx.fillStyle = '#000000';
      ctx.fillRect(25, FOUL_LINE_Y - 2, 450, 5);
      ctx.fillStyle = '#d60000';
      ctx.fillRect(25, FOUL_LINE_Y, 450, 2);

      // Pin Deck Spots
      pinOrigins.forEach(p => {
        const scale = getScale(p.y);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath();
        ctx.arc(p.x, p.y + 10 * scale, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. REALISTIC PINS
      const sortedPins = [...pins].sort((a, b) => a.y - b.y);
      sortedPins.forEach(pin => {
        if (pin.opacity <= 0) return;

        const scale = getScale(pin.y) * 2.0;
        ctx.save();
        ctx.globalAlpha = pin.opacity;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(pin.x, pin.y + 6 * scale, 8.5 * scale, 3 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pin Body
        ctx.beginPath();
        ctx.moveTo(pin.x - 3 * scale, pin.y - 18 * scale);
        ctx.bezierCurveTo(pin.x - 5 * scale, pin.y - 18 * scale, pin.x - 4 * scale, pin.y - 12 * scale, pin.x - 2.5 * scale, pin.y - 9 * scale);
        ctx.bezierCurveTo(pin.x - 8 * scale, pin.y - 4 * scale, pin.x - 8.5 * scale, pin.y + 2 * scale, pin.x - 6.5 * scale, pin.y + 6 * scale);
        ctx.lineTo(pin.x + 6.5 * scale, pin.y + 6 * scale);
        ctx.bezierCurveTo(pin.x + 8.5 * scale, pin.y + 2 * scale, pin.x + 8 * scale, pin.y - 4 * scale, pin.x + 2.5 * scale, pin.y - 9 * scale);
        ctx.bezierCurveTo(pin.x + 4 * scale, pin.y - 12 * scale, pin.x + 5 * scale, pin.y - 18 * scale, pin.x + 3 * scale, pin.y - 18 * scale);
        ctx.closePath();

        const pinGrad = ctx.createLinearGradient(pin.x - 6 * scale, 0, pin.x + 6 * scale, 0);
        pinGrad.addColorStop(0, '#cfd8dc');
        pinGrad.addColorStop(0.35, '#ffffff');
        pinGrad.addColorStop(0.8, '#eceff1');
        pinGrad.addColorStop(1, '#b0bec5');
        ctx.fillStyle = pinGrad;
        ctx.fill();

        // Red Neck Bands
        ctx.fillStyle = '#d60000';
        ctx.fillRect(pin.x - 3.2 * scale, pin.y - 13.5 * scale, 6.4 * scale, 1.8 * scale);
        ctx.fillRect(pin.x - 3.6 * scale, pin.y - 10.8 * scale, 7.2 * scale, 1.8 * scale);

        ctx.restore();
      });

      // 7. AIMING LINE
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        const aimX = ball.x - (dragStart.x - dragCurrent.x);
        const aimY = ball.y - (dragStart.y - dragCurrent.y);
        ctx.lineTo(aimX, aimY);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 8. BOWLING BALL
      const ballScale = getScale(ball.y);
      const scaledRadius = ball.radius * ballScale;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y + scaledRadius * 0.8, scaledRadius * 1.05, scaledRadius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Distinguish Ball Color for Player 2 (Gold vs Cyan)
      const ballGrad = ctx.createRadialGradient(
        ball.x - scaledRadius * 0.35, 
        ball.y - scaledRadius * 0.35, 
        scaledRadius * 0.05, 
        ball.x, 
        ball.y, 
        scaledRadius
      );
      
      if (activePlayer === 0) {
        ballGrad.addColorStop(0, '#00f2fe');
        ballGrad.addColorStop(0.3, '#4facfe');
        ballGrad.addColorStop(0.75, '#002244');
        ballGrad.addColorStop(1, '#000814');
      } else {
        ballGrad.addColorStop(0, '#ffe066');
        ballGrad.addColorStop(0.3, '#d4af37');
        ballGrad.addColorStop(0.75, '#5c4500');
        ballGrad.addColorStop(1, '#1a1300');
      }

      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.rotation);

      ctx.beginPath();
      ctx.arc(0, 0, scaledRadius, 0, Math.PI * 2);
      ctx.fillStyle = ballGrad;
      ctx.fill();

      // Finger Grips
      ctx.fillStyle = '#050a10';
      ctx.beginPath();
      ctx.arc(-3 * ballScale, -4 * ballScale, 2 * ballScale, 0, Math.PI * 2);
      ctx.arc(3 * ballScale, -4 * ballScale, 2 * ballScale, 0, Math.PI * 2);
      ctx.arc(0, 3 * ballScale, 2.4 * ballScale, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initPins();
    updateUI();
    gameLoop();
  </script>
</body>
</html>
