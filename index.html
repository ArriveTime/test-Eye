<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTakeout | Find Local Takeout Fast</title>
    
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Leaflet Interactive Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 2.2rem;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 280px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        /* Interactive Map Container */
        #map {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #e0e0e0;
            z-index: 1;
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #eee;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--primary-dark);
        }

        .card p {
            margin: 6px 0;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .card .phone {
            font-weight: 600;
            color: var(--primary);
            margin-top: 10px;
        }

        .card .phone a {
            color: var(--primary);
            text-decoration: none;
        }

        .card .phone a:hover {
            text-decoration: underline;
        }

        .status-msg {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>UTakeout</h1>
        <p>Find local takeout restaurants near you</p>
    </header>

    <div class="search-box">
        <input type="text" id="zipInput" placeholder="Enter US ZIP code (e.g. 23188)" maxlength="5">
        <button onclick="searchZip()">Search Takeout</button>
    </div>

    <!-- Real-Time Interactive Map -->
    <div id="map"></div>

    <!-- Dynamic Results Container -->
    <div id="results" class="results-grid">
        <div class="status-msg">Enter a ZIP code above to search live takeout options.</div>
    </div>
</div>

<script>
    // 1. Supabase Credentials Integrated
    const SUPABASE_URL = "https://lagieqygqqusbfqvywam.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yWIMlx1ju0IEPzFPLBjMaA_nZQlYp0A"; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Initialize Map (Default centered on US)
    let map = L.map('map').setView([37.0902, -95.7129], 4);
    let markersGroup = L.layerGroup().addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Allow search when pressing Enter key
    document.getElementById('zipInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            searchZip();
        }
    });

    // 3. Search Functionality
    async function searchZip() {
        const zip = document.getElementById('zipInput').value.trim();
        const resultsContainer = document.getElementById('results');

        if (!zip || zip.length < 5) {
            alert('Please enter a valid 5-digit ZIP code.');
            return;
        }

        resultsContainer.innerHTML = '<div class="status-msg">Searching Supabase database...</div>';
        markersGroup.clearLayers();

        try {
            // Query Supabase table 'restaurants' for matching zip
            const { data, error } = await supabaseClient
                .from('restaurants')
                .select('*')
                .eq('zip', zip);

            if (error) throw error;

            if (!data || data.length === 0) {
                resultsContainer.innerHTML = `<div class="status-msg">No restaurants found in ZIP code ${zip}.</div>`;
                return;
            }

            // Render Results & Update Map
            renderResults(data);

        } catch (err) {
            console.error('Supabase fetch error:', err);
            resultsContainer.innerHTML = `<div class="status-msg">Error querying database: ${err.message || 'Check table configuration.'}</div>`;
        }
    }

    // 4. Render Cards & Map Pins
    function renderResults(restaurants) {
        const resultsContainer = document.getElementById('results');
        resultsContainer.innerHTML = '';
        
        let bounds = [];

        restaurants.forEach(item => {
            const name = item.name || 'Restaurant';
            const address = item.address || 'N/A';
            const zip = item.zip || '';
            const phone = item.phone || 'N/A';
            const formattedPhone = phone !== 'N/A' ? `<a href="tel:${phone.replace(/\D/g,'')}">${phone}</a>` : 'N/A';

            // Add card to grid
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${name}</h3>
                <p><strong>Address:</strong> ${address}</p>
                <p><strong>ZIP:</strong> ${zip}</p>
                <p class="phone"><strong>Phone:</strong> ${formattedPhone}</p>
            `;
            resultsContainer.appendChild(card);

            // Add marker to map if coordinates exist
            if (item.latitude && item.longitude) {
                const latLng = [parseFloat(item.latitude), parseFloat(item.longitude)];
                bounds.push(latLng);
                
                L.marker(latLng)
                    .bindPopup(`<b>${name}</b><br>${address}<br>${phone}`)
                    .addTo(markersGroup);
            }
        });

        // Auto-center and zoom map to fit all returned markers
        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    }
</script>

</body>
</html>
