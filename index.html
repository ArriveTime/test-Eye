<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BowlStrike.com - Pro Tour Lanes</title>
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: linear-gradient(145deg, #121620 0%, #0a0d14 100%);
      --accent-gold: #d4af37;
      --accent-cyan: #00e5ff;
      --text-main: #f0f4f8;
      --text-muted: #7f8c9d;
      --border-color: #1e2636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Scoreboard HUD */
    #scoreboard {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .hud-group {
      text-align: center;
      flex: 1;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .hud-group:last-child {
      border-right: none;
    }

    .hud-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.4rem;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    .hud-value.highlight {
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* Game Canvas Container */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d3748;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    /* Controls Bar */
    #controls-panel {
      width: 100%;
      max-width: 540px;
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 6px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .instructions {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .instructions strong {
      color: var(--text-main);
    }

    .btn-pro {
      background: linear-gradient(180deg, #242d3c 0%, #121722 100%);
      color: var(--text-main);
      border: 1px solid #3b485d;
      padding: 7px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pro:hover {
      border-color: var(--accent-gold);
      color: #ffffff;
    }

    #game-overlay {
      position: absolute;
      top: 32%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.9), 0 4px 8px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: scale(0.85);
      z-index: 10;
      font-style: italic;
    }

    #game-overlay.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">BowlStrike.com</div>
    <div class="brand-subtitle">PRO TOUR EDITION</div>
  </header>

  <div id="scoreboard">
    <div class="hud-group">
      <div class="hud-label">Frame</div>
      <div class="hud-value" id="frame-display">1 / 10</div>
    </div>
    <div class="hud-group">
      <div class="hud-label">Shot</div>
      <div class="hud-value" id="ball-display">1</div>
    </div>
    <div class="hud-group">
      <div class="hud-label">Score</div>
      <div class="hud-value highlight" id="score-display">0</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="bowlingCanvas" width="500" height="720"></canvas>
    <div id="game-overlay">STRIKE!</div>
  </div>

  <div id="controls-panel">
    <div class="instructions" id="instruction-text">
      <strong>Swipe / Drag backward</strong> behind the foul line to roll.
    </div>
    <button class="btn-pro" onclick="resetGame()">Reset Frame</button>
  </div>

  <script>
    const canvas = document.getElementById('bowlingCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('game-overlay');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playRollSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(130, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.2);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playPinSound(count) {
      if (!audioCtx) return;
      const duration = 0.5;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, audioCtx.currentTime);
      filter.Q.setValueAtTime(2.2, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(Math.min(0.3 + count * 0.08, 0.85), audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function playCheerSound() {
      if (!audioCtx) return;
      const duration = 2.8;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.12;
        b6 = white * 0.115926;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(950, audioCtx.currentTime);
      filter.Q.setValueAtTime(1.0, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // State Variables
    let currentFrame = 1;
    let currentRoll = 1;
    let totalScore = 0;
    let gameOver = false;

    const FOUL_LINE_Y = 580;

    let ball = {
      x: 250,
      y: 645,
      radius: 16,
      vx: 0,
      vy: 0,
      isRolling: false,
      canAim: true,
      hasHitPins: false,
      rotation: 0
    };

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    const pinOrigins = [
      { id: 1,  row: 1, col: 1, x: 250, y: 200 }, 
      { id: 2,  row: 2, col: 1, x: 222, y: 177 },
      { id: 3,  row: 2, col: 2, x: 278, y: 177 },
      { id: 4,  row: 3, col: 1, x: 194, y: 154 },
      { id: 5,  row: 3, col: 2, x: 250, y: 154 },
      { id: 6,  row: 3, col: 3, x: 306, y: 154 },
      { id: 7,  row: 4, col: 1, x: 166, y: 131 },
      { id: 8,  row: 4, col: 2, x: 222, y: 131 },
      { id: 9,  row: 4, col: 3, x: 278, y: 131 },
      { id: 10, row: 4, col: 4, x: 334, y: 131 }
    ];

    let pins = [];

    function initPins() {
      pins = pinOrigins.map(p => ({
        ...p,
        isStanding: true,
        knockedX: 0,
        knockedY: 0,
        opacity: 1
      }));
    }

    function getScale(y) {
      return 0.38 + (y / 720) * 0.62;
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleStart(e) {
      initAudio();
      if (!ball.canAim || ball.isRolling || gameOver) return;
      const pos = getCanvasCoordinates(e);
      if (Math.hypot(pos.x - ball.x, pos.y - ball.y) < 60) {
        isDragging = true;
        dragStart = pos;
        dragCurrent = pos;
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      dragCurrent = getCanvasCoordinates(e);
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;

      if (dy > 15) {
        ball.vx = -dx * 0.12;
        ball.vy = -dy * 0.22;
        ball.vy = Math.max(ball.vy, -19);
        ball.vx = Math.max(Math.min(ball.vx, 8.5), -8.5);
        
        ball.isRolling = true;
        ball.canAim = false;
        ball.hasHitPins = false;

        playRollSound();
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: true });
    canvas.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    function showOverlay(text) {
      overlay.innerText = text;
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 1800);
    }

    function update() {
      if (ball.isRolling) {
        // Strike Magnet Assist: Gently nudge trajectory into headpin pocket
        if (ball.y < 320 && ball.y > 200) {
          ball.x += (250 - ball.x) * 0.08;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy *= 0.993;
        ball.rotation += Math.abs(ball.vy) * 0.08;

        let hitThisFrame = 0;

        // Expanded Strike Physics Hit Detection Radius
        pins.forEach(pin => {
          if (pin.isStanding) {
            const dist = Math.hypot(ball.x - pin.x, ball.y - pin.y);
            const scale = getScale(pin.y);
            if (dist < (ball.radius + 38 * scale)) {
              pin.isStanding = false;
              pin.knockedX = (pin.x - ball.x) * 1.2 + (Math.random() - 0.5) * 18;
              pin.knockedY = -Math.abs(ball.vy) * 0.75;
              hitThisFrame++;
            }
          }
        });

        // Pin-to-Pin Domino Cascade Effect
        pins.forEach(pin1 => {
          if (!pin1.isStanding && pin1.opacity > 0.5) {
            pins.forEach(pin2 => {
              if (pin2.isStanding) {
                const dist = Math.hypot(pin1.x - pin2.x, pin1.y - pin2.y);
                if (dist < 48) {
                  pin2.isStanding = false;
                  pin2.knockedX = (pin2.x - pin1.x) * 1.1 + (Math.random() - 0.5) * 15;
                  pin2.knockedY = pin1.knockedY * 0.8;
                  hitThisFrame++;
                }
              }
            });
          }
        });

        if (hitThisFrame > 0 && !ball.hasHitPins) {
          playPinSound(hitThisFrame);
          ball.hasHitPins = true;
        }

        pins.forEach(pin => {
          if (!pin.isStanding && pin.opacity > 0) {
            pin.x += pin.knockedX;
            pin.y += pin.knockedY;
            pin.knockedX *= 0.88;
            pin.knockedY *= 0.88;
            pin.opacity -= 0.025;
          }
        });

        if (ball.y < 110 || Math.abs(ball.vy) < 0.2) {
          endRoll();
        }
      }
    }

    function endRoll() {
      ball.isRolling = false;
      const knockedThisRoll = pins.filter(p => !p.isStanding && p.opacity > 0).length;
      totalScore += knockedThisRoll;

      pins.forEach(p => { if (!p.isStanding) p.opacity = 0; });

      const standingCount = pins.filter(p => p.isStanding).length;

      if (currentRoll === 1) {
        if (standingCount === 0) {
          showOverlay("STRIKE!");
          playCheerSound();
          nextFrame();
        } else {
          currentRoll = 2;
          resetBall();
        }
      } else {
        if (standingCount === 0) {
          showOverlay("SPARE!");
          playCheerSound();
        } else if (knockedThisRoll === 0) {
          showOverlay("GUTTER!");
        }
        nextFrame();
      }

      updateUI();
    }

    function resetBall() {
      ball.x = 250;
      ball.y = 645;
      ball.vx = 0;
      ball.vy = 0;
      ball.isRolling = false;
      ball.canAim = true;
    }

    function nextFrame() {
      if (currentFrame >= 10) {
        gameOver = true;
        showOverlay("GAME OVER");
        document.getElementById('instruction-text').innerHTML = 
          `<strong>Final Score: ${totalScore}</strong>. Click Reset to start again.`;
      } else {
        currentFrame++;
        currentRoll = 1;
        setTimeout(() => {
          initPins();
          resetBall();
        }, 1200);
      }
    }

    function resetGame() {
      currentFrame = 1;
      currentRoll = 1;
      totalScore = 0;
      gameOver = false;
      document.getElementById('instruction-text').innerHTML = 
        `<strong>Swipe / Drag backward</strong> behind the foul line to roll.`;
      initPins();
      resetBall();
      updateUI();
    }

    function updateUI() {
      document.getElementById('frame-display').innerText = `${currentFrame} / 10`;
      document.getElementById('ball-display').innerText = currentRoll;
      document.getElementById('score-display').innerText = totalScore;
    }

    // Canvas Rendering Engine
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. BACKDROP & OVERHEAD MASKING UNIT
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, 120);

      // Casing Box
      const panelGrad = ctx.createLinearGradient(0, 0, 0, 100);
      panelGrad.addColorStop(0, '#1a202c');
      panelGrad.addColorStop(0.5, '#0f141d');
      panelGrad.addColorStop(1, '#080b10');
      ctx.fillStyle = panelGrad;
      ctx.fillRect(40, 10, 420, 90);

      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 3;
      ctx.strokeRect(40, 10, 420, 90);

      // Score Display Frame on Masking Unit
      ctx.fillStyle = '#030508';
      ctx.fillRect(140, 25, 220, 36);
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(140, 25, 220, 36);

      // BowlStrike.com Text Display
      ctx.fillStyle = '#00e5ff';
      ctx.font = '800 17px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`BowlStrike.com`, 250, 49);

      // Ambient Pin Light Glow
      const pitGlow = ctx.createRadialGradient(250, 125, 10, 250, 125, 180);
      pitGlow.addColorStop(0, 'rgba(255, 235, 200, 0.25)');
      pitGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = pitGlow;
      ctx.fillRect(50, 100, 400, 110);

      // Pit Cavity Back Wall Depth
      ctx.fillStyle = '#030406';
      ctx.fillRect(100, 100, 300, 25);

      // 2. APPROACH HARDWOOD FLOOR
      const approachGrad = ctx.createLinearGradient(0, FOUL_LINE_Y, 0, 720);
      approachGrad.addColorStop(0, '#b87c33');
      approachGrad.addColorStop(1, '#8f5c20');
      ctx.fillStyle = approachGrad;
      ctx.fillRect(0, FOUL_LINE_Y, canvas.width, 720 - FOUL_LINE_Y);

      // 3. MAIN MAPLE WOOD LANE FLOOR
      const laneGrad = ctx.createLinearGradient(0, 125, 0, FOUL_LINE_Y);
      laneGrad.addColorStop(0, '#8c5822');  
      laneGrad.addColorStop(0.5, '#ad7533'); 
      laneGrad.addColorStop(1, '#ca8d3e');   

      ctx.beginPath();
      ctx.moveTo(140, 125);  
      ctx.lineTo(360, 125);  
      ctx.lineTo(475, FOUL_LINE_Y);  
      ctx.lineTo(25, FOUL_LINE_Y);   
      ctx.closePath();
      ctx.fillStyle = laneGrad;
      ctx.fill();

      // Board Planks Shading
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      for (let i = -8; i <= 8; i++) {
        ctx.beginPath();
        ctx.moveTo(250 + i * 11, 125);
        ctx.lineTo(250 + i * 27, FOUL_LINE_Y);
        ctx.stroke();
      }

      // Wax Sheen Reflections
      const waxGrad = ctx.createLinearGradient(0, 200, 0, FOUL_LINE_Y);
      waxGrad.addColorStop(0, 'rgba(255, 255, 255, 0.0)');
      waxGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.06)');
      waxGrad.addColorStop(1, 'rgba(255, 255, 255, 0.16)');
      ctx.fillStyle = waxGrad;
      ctx.fill();

      // 4. GUTTERS
      ctx.fillStyle = '#11151c';
      // Left Gutter
      ctx.beginPath();
      ctx.moveTo(80, 125); ctx.lineTo(140, 125); ctx.lineTo(25, FOUL_LINE_Y); ctx.lineTo(0, FOUL_LINE_Y);
      ctx.fill();
      // Right Gutter
      ctx.beginPath();
      ctx.moveTo(360, 125); ctx.lineTo(420, 125); ctx.lineTo(500, FOUL_LINE_Y); ctx.lineTo(475, FOUL_LINE_Y);
      ctx.fill();

      // 5. TARGETING ARROWS & FOUL LINE
      ctx.fillStyle = '#42280c';
      [-60, -40, -20, 0, 20, 40, 60].forEach(offset => {
        const scale = getScale(420);
        const ax = 250 + offset * 2.1;
        ctx.beginPath();
        ctx.moveTo(ax, 420);
        ctx.lineTo(ax - 3 * scale, 432);
        ctx.lineTo(ax + 3 * scale, 432);
        ctx.closePath();
        ctx.fill();
      });

      // Foul Line
      ctx.fillStyle = '#000000';
      ctx.fillRect(25, FOUL_LINE_Y - 2, 450, 5);
      ctx.fillStyle = '#d60000';
      ctx.fillRect(25, FOUL_LINE_Y, 450, 2);

      // Pin Deck Spots
      pinOrigins.forEach(p => {
        const scale = getScale(p.y);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath();
        ctx.arc(p.x, p.y + 10 * scale, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. REALISTIC PINS
      const sortedPins = [...pins].sort((a, b) => a.y - b.y);
      sortedPins.forEach(pin => {
        if (pin.opacity <= 0) return;

        const scale = getScale(pin.y) * 2.0;
        ctx.save();
        ctx.globalAlpha = pin.opacity;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(pin.x, pin.y + 6 * scale, 8.5 * scale, 3 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pin Hourglass Body
        ctx.beginPath();
        ctx.moveTo(pin.x - 3 * scale, pin.y - 18 * scale);
        ctx.bezierCurveTo(pin.x - 5 * scale, pin.y - 18 * scale, pin.x - 4 * scale, pin.y - 12 * scale, pin.x - 2.5 * scale, pin.y - 9 * scale);
        ctx.bezierCurveTo(pin.x - 8 * scale, pin.y - 4 * scale, pin.x - 8.5 * scale, pin.y + 2 * scale, pin.x - 6.5 * scale, pin.y + 6 * scale);
        ctx.lineTo(pin.x + 6.5 * scale, pin.y + 6 * scale);
        ctx.bezierCurveTo(pin.x + 8.5 * scale, pin.y + 2 * scale, pin.x + 8 * scale, pin.y - 4 * scale, pin.x + 2.5 * scale, pin.y - 9 * scale);
        ctx.bezierCurveTo(pin.x + 4 * scale, pin.y - 12 * scale, pin.x + 5 * scale, pin.y - 18 * scale, pin.x + 3 * scale, pin.y - 18 * scale);
        ctx.closePath();

        const pinGrad = ctx.createLinearGradient(pin.x - 6 * scale, 0, pin.x + 6 * scale, 0);
        pinGrad.addColorStop(0, '#cfd8dc');
        pinGrad.addColorStop(0.35, '#ffffff');
        pinGrad.addColorStop(0.8, '#eceff1');
        pinGrad.addColorStop(1, '#b0bec5');
        ctx.fillStyle = pinGrad;
        ctx.fill();

        // Red Neck Bands
        ctx.fillStyle = '#d60000';
        ctx.fillRect(pin.x - 3.2 * scale, pin.y - 13.5 * scale, 6.4 * scale, 1.8 * scale);
        ctx.fillRect(pin.x - 3.6 * scale, pin.y - 10.8 * scale, 7.2 * scale, 1.8 * scale);

        ctx.restore();
      });

      // 7. AIMING LINE
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        const aimX = ball.x - (dragStart.x - dragCurrent.x);
        const aimY = ball.y - (dragStart.y - dragCurrent.y);
        ctx.lineTo(aimX, aimY);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 8. BOWLING BALL
      const ballScale = getScale(ball.y);
      const scaledRadius = ball.radius * ballScale;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y + scaledRadius * 0.8, scaledRadius * 1.05, scaledRadius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      const ballGrad = ctx.createRadialGradient(
        ball.x - scaledRadius * 0.35, 
        ball.y - scaledRadius * 0.35, 
        scaledRadius * 0.05, 
        ball.x, 
        ball.y, 
        scaledRadius
      );
      ballGrad.addColorStop(0, '#00f2fe');
      ballGrad.addColorStop(0.3, '#4facfe');
      ballGrad.addColorStop(0.75, '#002244');
      ballGrad.addColorStop(1, '#000814');

      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.rotation);

      ctx.beginPath();
      ctx.arc(0, 0, scaledRadius, 0, Math.PI * 2);
      ctx.fillStyle = ballGrad;
      ctx.fill();

      // Finger Grips
      ctx.fillStyle = '#050a10';
      ctx.beginPath();
      ctx.arc(-3 * ballScale, -4 * ballScale, 2 * ballScale, 0, Math.PI * 2);
      ctx.arc(3 * ballScale, -4 * ballScale, 2 * ballScale, 0, Math.PI * 2);
      ctx.arc(0, 3 * ballScale, 2.4 * ballScale, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initPins();
    gameLoop();
  </script>
</body>
