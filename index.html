<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Precision Hair & Style Studio</title>
  
  <!-- MediaPipe Face Mesh & Camera Utilities -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(21, 29, 48, 0.85);
      --border: rgba(255, 255, 255, 0.15);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 { font-size: 1.6rem; color: #a78bfa; margin-bottom: 4px; }
    p { color: var(--text-muted); font-size: 0.9rem; }

    /* Dual Side-by-Side Viewport Layout */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
    }

    @media (min-width: 768px) {
      .studio-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .viewport-card {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .viewport-card header {
      position: absolute;
      top: 10px; left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .label-orig { color: #94a3b8; }
    .label-trans { color: #c4b5fd; }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .mirror { transform: scaleX(-1); }

    /* Controls Panel Dock */
    .controls-dock {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dock-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .swatch:hover { transform: scale(1.1); }
    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .slider-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .slider-field {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <h1>AI Live Hair Studio</h1>
    <p>Original Camera Feed vs Real-Time Precision Hair Transformation</p>
  </header>

  <div class="studio-grid">
    <!-- Left Screen: Original Camera Stream -->
    <div class="viewport-card">
      <header class="label-orig">1. Original Feed</header>
      <video id="webcam" class="mirror" playsinline></video>
    </div>

    <!-- Right Screen: Transformed Hair View -->
    <div class="viewport-card">
      <header class="label-trans">2. Transformed Hair</header>
      <canvas id="outputCanvas" class="mirror"></canvas>
    </div>
  </div>

  <!-- Interactive Controls -->
  <div class="controls-dock">
    <div>
      <div class="dock-title" style="margin-bottom: 8px;">Select Hair Color Dye</div>
      <div class="swatch-row">
        <div class="swatch selected" style="background: #e2b070;" data-color="rgba(226, 176, 112, "></div>
        <div class="swatch" style="background: #8d2e16;" data-color="rgba(141, 46, 22, "></div>
        <div class="swatch" style="background: #ec4899;" data-color="rgba(236, 72, 153, "></div>
        <div class="swatch" style="background: #10b981;" data-color="rgba(16, 185, 129, "></div>
        <div class="swatch" style="background: #3b82f6;" data-color="rgba(59, 130, 246, "></div>
        <div class="swatch" style="background: #111827;" data-color="rgba(17, 24, 39, "></div>
        <div class="swatch" style="background: #a855f7;" data-color="rgba(168, 85, 247, "></div>
        <div class="swatch" style="background: #f97316;" data-color="rgba(249, 115, 22, "></div>
      </div>
    </div>

    <div class="slider-group">
      <div class="slider-field">
        <label>Dye Saturation <span id="opacityVal">75%</span></label>
        <input type="range" id="opacitySlider" min="20" max="100" value="75">
      </div>
      <div class="slider-field">
        <label>Hair Line Offset <span id="offsetVal">0px</span></label>
        <input type="range" id="offsetSlider" min="-20" max="30" value="0">
      </div>
    </div>

    <div class="action-row">
      <button id="snapBtn" class="btn">📷 Download Transformed Snapshot</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const offsetSlider = document.getElementById('offsetSlider');
    const offsetVal = document.getElementById('offsetVal');
    const snapBtn = document.getElementById('snapBtn');

    let currentColorBase = 'rgba(226, 176, 112, ';
    let dyeOpacity = 0.75;
    let hairlineOffset = 0;
    let faceLandmarks = null;

    // Swatch Selection
    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        currentColorBase = swatch.getAttribute('data-color');
      });
    });

    opacitySlider.addEventListener('input', (e) => {
      dyeOpacity = e.target.value / 100;
      opacityVal.innerText = `${e.target.value}%`;
    });

    offsetSlider.addEventListener('input', (e) => {
      hairlineOffset = parseInt(e.target.value, 10);
      offsetVal.innerText = `${hairlineOffset}px`;
    });

    // Face Mesh Initialization (Tracks hairline & forehead boundaries)
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        faceLandmarks = results.multiFaceLandmarks[0];
      }
    });

    // Selfie Segmentation Callback
    function onSegmentationResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // Render Base Original Camera Stream to Right Canvas
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (results.segmentationMask && faceLandmarks) {
        // Create dynamic off-screen hair mask
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w;
        maskCanvas.height = h;
        const maskCtx = maskCanvas.getContext('2d');

        // Draw body segment mask
        maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);

        // Exclude face & lower body by building a forehead boundary cut
        // Eyebrow & Forehead landmarks in Face Mesh: [10, 338, 297, 332, 284, 251, 389, 162, 21, 54, 103, 67, 109]
        const foreheadIndices = [10, 338, 297, 332, 284, 251, 389, 162, 21, 54, 103, 67, 109];
        
        maskCtx.globalCompositeOperation = 'destination-out';
        maskCtx.beginPath();

        // Path around lower face to isolate the top hair region
        const chinY = faceLandmarks[152].y * h;
        const foreheadY = (faceLandmarks[10].y * h) + hairlineOffset;

        maskCtx.moveTo(0, foreheadY);
        foreheadIndices.forEach(idx => {
          const pt = faceLandmarks[idx];
          maskCtx.lineTo(pt.x * w, (pt.y * h) + hairlineOffset);
        });

        maskCtx.lineTo(w, foreheadY);
        maskCtx.lineTo(w, h);
        maskCtx.lineTo(0, h);
        maskCtx.closePath();
        maskCtx.fill();

        // Apply Hair Color Dye strictly inside the isolated hair region
        canvasCtx.save();
        
        // Multiply & Soft-Light Blending to preserve underlying hair strands and highlights
        canvasCtx.globalCompositeOperation = 'soft-light';
        canvasCtx.fillStyle = `${currentColorBase}${dyeOpacity})`;
        canvasCtx.fillRect(0, 0, w, h);

        canvasCtx.globalCompositeOperation = 'color';
        canvasCtx.fillStyle = `${currentColorBase}${dyeOpacity * 0.8})`;
        canvasCtx.fillRect(0, 0, w, h);

        // Clip blending layers strictly inside the hair mask
        canvasCtx.globalCompositeOperation = 'destination-in';
        canvasCtx.drawImage(maskCanvas, 0, 0);

        canvasCtx.restore();

        // Place original video beneath the transformed hair overlay
        canvasCtx.globalCompositeOperation = 'destination-over';
        canvasCtx.drawImage(results.image, 0, 0, w, h);
      }

      canvasCtx.restore();
    }

    // Selfie Segmentation Engine
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults(onSegmentationResults);

    // Single Camera Stream Pipeline feeding both AI models
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        await selfieSegmentation.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start().catch(err => {
      alert("Camera access required for live hair studio.");
      console.error(err);
    });

    // Save High-Res Snapshot
    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'transformed-hair.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
