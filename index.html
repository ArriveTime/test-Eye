<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Fast. Park Free. Park LV.</title>
    <!-- Leaflet Open-Source Mapping CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-gold: #ffd700;
            --text-blue: #0d47a1;
            --text-light: #ffffff;
            --map-bg-white: #ffffff;
            --border-color: #bbdefb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

        body {
            background-color: var(--bg-gold);
            background-image: 
                linear-gradient(to bottom, rgba(255, 215, 0, 0.8), rgba(255, 215, 0, 0.95)),
                url('https://images.unsplash.com/photo-1605035012319-110213f4525c?q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-blue);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 2px solid var(--border-color);
            background-color: rgba(255, 215, 0, 0.9);
        }

        .logo-title { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; color: var(--text-blue); }
        
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            padding: 25px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 992px) { .main-container { grid-template-columns: 1fr 380px; } }

        .btn-locate {
            background-color: var(--text-blue);
            color: var(--text-light);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            align-self: flex-start;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        .btn-locate:hover { opacity: 0.9; }

        .map-panel {
            background-color: var(--map-bg-white);
            border-radius: 16px;
            border: 4px solid var(--text-blue) !important;
            height: 500px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        #map { height: 100%; width: 100%; }

        .control-panel {
            background-color: var(--text-blue);
            color: var(--text-light);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .panel-header {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 8px;
            border: none;
            margin-top: 5px;
            font-size: 1rem;
            color: #333;
        }

        .btn-action {
            background-color: var(--bg-gold);
            color: var(--text-blue);
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-action:hover { opacity: 0.95; transform: translateY(-1px); }

        .status-box { background-color: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px; }
        
        .user-location-marker {
            background-color: var(--text-blue);
            border: 3px solid var(--bg-gold);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(13, 71, 161, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(13, 71, 161, 0); }
            100% { box-shadow: 0 0 0 0 rgba(13, 71, 161, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">Park Fast. Park Free. Park LV.</h1>
    </header>

    <div class="main-container">
        <div class="map-wrapper">
            <button class="btn-locate" onclick="initRealTimeLocation()">📍 Re-Center Location</button>
            <div class="map-panel">
                <div id="map"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="panel-header">Find Parking</div>
            <label>1. Your Location</label>
            <!-- Field is editable for street addresses -->
            <input type="text" id="start-loc" class="input-field" placeholder="Detecting address or type here..." />
            
            <label>2. Destination</label>
            <input type="text" id="dest-loc" class="input-field" value="The Cosmopolitan of Las Vegas" />

            <button class="btn-action" onclick="locateAndRoute()">Find Closest Free Spot</button>
            
            <div class="status-box">
                <div id="output-log">Detecting location automatically...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([36.1147, -115.1728], 15);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let userMarker;
        let accuracyCircle;
        let watchId = null;
        let parkingMarkers = [];
        const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [24, 24], iconAnchor: [12, 12] });
        const logger = document.getElementById('output-log');

        // Sample free parking spot dataset for Las Vegas
        const freeParkingSpots = [
            { name: "Treasure Island Garage (Free Parking)", lat: 36.1247, lng: -115.1721 },
            { name: "Fashion Show Mall Garage (Free Parking)", lat: 36.1275, lng: -115.1728 },
            { name: "The Venetian / Palazzo (Free Self-Park for Select Status/Promos)", lat: 36.1212, lng: -115.1689 },
            { name: "SAHARA Las Vegas (Free Self-Parking)", lat: 36.1422, lng: -115.1565 },
            { name: "Circus Circus (Free Self-Parking)", lat: 36.1368, lng: -115.1633 }
        ];

        // Automatically prompt for location when the page finishes loading
        window.addEventListener('DOMContentLoaded', () => {
            initRealTimeLocation();
        });

        function updatePositionOnMap(lat, lng, accuracy) {
            // Update or create user marker
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { icon: userIcon })
                    .addTo(map)
                    .bindPopup("<b>📍 Your Current Location</b>");
            }

            // Update or create accuracy circle
            if (accuracyCircle) {
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy || 0);
            } else if (accuracy) {
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy,
                    color: '#0d47a1',
                    fillColor: '#0d47a1',
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
            }

            map.setView([lat, lng], 16);

            // Free reverse geocoding to display street address instead of raw GPS coordinates
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    const address = data.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    document.getElementById('start-loc').value = address;
                    const roadName = (data.address && data.address.road) ? data.address.road : 'Current Location';
                    logger.innerHTML = `✅ Location set to: ${roadName}`;
                })
                .catch(() => {
                    document.getElementById('start-loc').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    logger.innerHTML = `✅ Location pinned via GPS.`;
                });
        }

        function initRealTimeLocation() {
            if (!navigator.geolocation) { 
                logger.innerHTML = "❌ Geolocation unsupported by browser."; 
                return; 
            }
            logger.innerHTML = "📡 Detecting real-time GPS location...";

            // Clear active position watch if re-triggering
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }

            // Continuous real-time GPS tracking
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    updatePositionOnMap(lat, lng, accuracy);
                },
                (error) => { 
                    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                        logger.innerHTML = `❌ GPS Error: Enforce HTTPS on GitHub Pages under Settings > Pages.`;
                    } else {
                        logger.innerHTML = `⚠️ Location permission denied or timed out. You can manually enter an address above.`;
                    }
                    // Fallback to default Las Vegas center marker if GPS permission blocked
                    if (!userMarker) {
                        updatePositionOnMap(36.1147, -115.1728, 0);
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function locateAndRoute() {
            // Clear existing parking pins
            parkingMarkers.forEach(marker => map.removeLayer(marker));
            parkingMarkers = [];

            logger.innerHTML = "🔍 Finding nearest free parking spots...";

            // Plot free parking spots on map
            freeParkingSpots.forEach(spot => {
                const marker = L.marker([spot.lat, spot.lng])
                    .addTo(map)
                    .bindPopup(`<b>${spot.name}</b><br><span style="color:green;font-weight:bold;">100% Free Parking</span>`);
                parkingMarkers.push(marker);
            });

            // Adjust view to show user location and all parking spots
            const allElements = [...parkingMarkers];
            if (userMarker) allElements.push(userMarker);
            
            const group = L.featureGroup(allElements);
            map.fitBounds(group.getBounds().pad(0.2));

            logger.innerHTML = `✅ Loaded ${freeParkingSpots.length} nearby free parking spots on map.`;
        }
    </script>
    <footer style="text-align: center; padding: 20px; font-size: 0.85rem; color: #0d47a1; margin-top: auto;">
        <p style="margin-bottom: 6px; font-weight: 700;">ParkLV.com is an independent parking information service.</p>
        <p><a href="privacy.html" style="color: #0d47a1; font-weight: bold;">Privacy Policy</a> | <a href="terms.html" style="color: #0d47a1; font-weight: bold;">Terms of Service</a></p>
        <p style="margin-top: 6px;">&copy; 2026 ParkLV.com - All Rights Reserved</p>
    </footer>
</body>
</html>
