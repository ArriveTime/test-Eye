<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Interactive Hair & Style Studio</title>
  
  <!-- MediaPipe Selfie Segmentation via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --overlay-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.15);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }

    /* Main Container */
    .studio-window {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      background: #000;
    }

    @media (max-aspect-ratio: 16/9) {
      .studio-window { aspect-ratio: 4/3; }
    }

    /* Video & Canvas Elements */
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .mirror { transform: scaleX(-1); }

    /* Floating UI Overlay Header */
    .overlay-header {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .brand-badge {
      background: var(--overlay-bg);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      color: #c4b5fd;
      pointer-events: auto;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .btn-pill {
      background: var(--overlay-bg);
      backdrop-filter: blur(12px);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-pill:hover, .btn-pill.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Floating Control Dock (Bottom Controls) */
    .control-dock {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      background: var(--overlay-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Swatches & Chips Row */
    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .swatch-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .swatch:hover { transform: scale(1.15); }
    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    /* Range Sliders */
    .slider-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .slider-field {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Mode Toggles */
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 3px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: white;
    }

    /* Split Screen Divider Overlay */
    .split-divider {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      z-index: 15;
      display: none;
      pointer-events: none;
    }

    .split-label {
      position: absolute;
      top: 60px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 15;
      display: none;
    }

    .split-left { left: 20px; color: #94a3b8; }
    .split-right { right: 20px; color: #c4b5fd; }
  </style>
</head>
<body>

  <div class="studio-window">
    <!-- Raw Webcam Feed -->
    <video id="webcam" class="mirror" playsinline></video>
    
    <!-- Real-time Processing Canvas -->
    <canvas id="outputCanvas" class="mirror"></canvas>

    <!-- Split-Screen Visual Indicators -->
    <div id="splitDivider" class="split-divider"></div>
    <div id="labelBefore" class="split-label split-left">Original</div>
    <div id="labelAfter" class="split-label split-right">Transformed</div>

    <!-- Floating Top Header -->
    <div class="overlay-header">
      <div class="brand-badge">✨ Live Hair Studio</div>
      <div class="top-actions">
        <button id="splitBtn" class="btn-pill">Compare (Split Screen)</button>
        <button id="snapBtn" class="btn-pill">📷 Snapshot</button>
      </div>
    </div>

    <!-- Floating Bottom Control Dock -->
    <div class="control-dock">
      <!-- Row 1: Mode Switch & Color Swatches -->
      <div class="dock-row">
        <div class="mode-switch">
          <button id="modeColor" class="mode-btn active">Color Dye</button>
          <button id="modeStyle" class="mode-btn">AI Hairstyle</button>
        </div>

        <div id="colorSwatches" class="swatch-group">
          <div class="swatch selected" style="background: #e2b070;" data-color="rgba(226, 176, 112, "></div>
          <div class="swatch" style="background: #8d2e16;" data-color="rgba(141, 46, 22, "></div>
          <div class="swatch" style="background: #ec4899;" data-color="rgba(236, 72, 153, "></div>
          <div class="swatch" style="background: #10b981;" data-color="rgba(16, 185, 129, "></div>
          <div class="swatch" style="background: #3b82f6;" data-color="rgba(59, 130, 246, "></div>
          <div class="swatch" style="background: #111827;" data-color="rgba(17, 24, 39, "></div>
          <div class="swatch" style="background: #a855f7;" data-color="rgba(168, 85, 247, "></div>
        </div>

        <div id="styleChips" class="swatch-group" style="display: none;">
          <button class="btn-pill active" data-style="wavy">Long Wavy</button>
          <button class="btn-pill" data-style="buzz">Buzz Cut</button>
          <button class="btn-pill" data-style="bob">Chic Bob</button>
          <button class="btn-pill" data-style="afro">Afro</button>
        </div>
      </div>

      <!-- Row 2: Live Adjustments Sliders -->
      <div class="slider-row">
        <div class="slider-field">
          <span>Dye Intensity</span>
          <input type="range" id="opacitySlider" min="20" max="95" value="70">
        </div>
        <div class="slider-field">
          <span>Highlight Shine</span>
          <input type="range" id="shineSlider" min="0" max="100" value="40">
        </div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    // Controls
    const modeColor = document.getElementById('modeColor');
    const modeStyle = document.getElementById('modeStyle');
    const colorSwatches = document.getElementById('colorSwatches');
    const styleChips = document.getElementById('styleChips');

    const splitBtn = document.getElementById('splitBtn');
    const splitDivider = document.getElementById('splitDivider');
    const labelBefore = document.getElementById('labelBefore');
    const labelAfter = document.getElementById('labelAfter');
    const snapBtn = document.getElementById('snapBtn');
    const opacitySlider = document.getElementById('opacitySlider');

    // State
    let activeMode = 'color';
    let isSplitView = false;
    let currentColorBase = 'rgba(226, 176, 112, ';
    let dyeOpacity = 0.7;

    // Toggle Modes
    modeColor.addEventListener('click', () => {
      activeMode = 'color';
      modeColor.classList.add('active');
      modeStyle.classList.remove('active');
      colorSwatches.style.display = 'flex';
      styleChips.style.display = 'none';
    });

    modeStyle.addEventListener('click', () => {
      activeMode = 'style';
      modeStyle.classList.add('active');
      modeColor.classList.remove('active');
      colorSwatches.style.display = 'none';
      styleChips.style.display = 'flex';
    });

    // Swatch Selection
    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        currentColorBase = swatch.getAttribute('data-color');
      });
    });

    // Toggle Split View
    splitBtn.addEventListener('click', () => {
      isSplitView = !isSplitView;
      splitBtn.classList.toggle('active', isSplitView);
      splitDivider.style.display = isSplitView ? 'block' : 'none';
      labelBefore.style.display = isSplitView ? 'block' : 'none';
      labelAfter.style.display = isSplitView ? 'block' : 'none';
    });

    opacitySlider.addEventListener('input', (e) => {
      dyeOpacity = e.target.value / 100;
    });

    // MediaPipe Processing Callback
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      // Render Camera Feed
      canvasCtx.drawImage(results.image, 0, 0, w, h);

      if (results.segmentationMask && activeMode === 'color') {
        // Create an offscreen buffer for the hair mask blending
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w;
        maskCanvas.height = h;
        const maskCtx = maskCanvas.getContext('2d');

        // Draw segment mask
        maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);

        // Calculate clip boundary if Split View is active
        const renderWidth = isSplitView ? w / 2 : w;
        const startX = isSplitView ? w / 2 : 0;

        canvasCtx.save();
        if (isSplitView) {
          canvasCtx.beginPath();
          canvasCtx.rect(startX, 0, renderWidth, h);
          canvasCtx.clip();
        }

        // Soft Color Composite Layer
        canvasCtx.globalCompositeOperation = 'soft-light';
        canvasCtx.fillStyle = `${currentColorBase}${dyeOpacity})`;
        canvasCtx.fillRect(0, 0, w, h);

        // Multiply Layer for depth
        canvasCtx.globalCompositeOperation = 'multiply';
        canvasCtx.fillStyle = `${currentColorBase}${dyeOpacity * 0.5})`;
        canvasCtx.fillRect(0, 0, w, h);

        // Restrict transformation strictly to hair mask
        canvasCtx.globalCompositeOperation = 'destination-in';
        canvasCtx.drawImage(maskCanvas, 0, 0);

        canvasCtx.restore();

        // Layer unedited camera base underneath
        canvasCtx.globalCompositeOperation = 'destination-over';
        canvasCtx.drawImage(results.image, 0, 0, w, h);
      }

      canvasCtx.restore();
    }

    // Initialize MediaPipe Segmentation Engine
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults(onResults);

    // Initialize Camera Feed
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await selfieSegmentation.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start().catch(err => {
      alert("Please allow camera access to use the live hair studio.");
      console.error(err);
    });

    // Save Snapshot
    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'hair-transformation.png';
      link.href = canvasElement.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
